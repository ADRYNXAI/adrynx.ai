<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1">
<title>ADRYNX Phoenix Prime</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;700;800&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:Inter,sans-serif}
body{background:#020a1e;display:flex;justify-content:center;overflow:hidden}
.app{width:100%;max-width:430px;height:100dvh;position:relative;overflow:hidden;background:#020a1e}
video{position:absolute;top:0;left:0;width:100%;height:100%;object-fit:cover;z-index:0}
.overlay{position:absolute;inset:0;z-index:1;background:linear-gradient(to bottom, rgba(2,10,30,.15) 0%, rgba(2,10,30,.75) 60%, #020a1e 92%)}
.content{position:absolute;inset:0;z-index:2;display:flex;flex-direction:column;align-items:center;padding:12px 14px 16px}
.logo{width:240px;height:240px;object-fit:contain;filter:drop-shadow(0 0 25px rgba(255,165,0,.7));margin-top:2px}
h1{color:#fff;font-size:40px;font-weight:800;letter-spacing:1px;line-height:.9;text-align:center;margin-top:2px}
h1 span{display:block;font-size:26px;background:linear-gradient(90deg,#ff8c1a,#ffb347);-webkit-background-clip:text;-webkit-text-fill-color:transparent;margin-top:4px}
.s1{color:#fff;font-size:14px;font-weight:600;margin-top:8px}
.s2{color:#ff8c1a;font-size:11px;margin-top:2px}

.grid{display:grid;grid-template-columns:1fr 1fr;gap:11px;width:100%;margin-top:16px}
.card{
  background:linear-gradient(145deg, rgba(255,255,255,.09), rgba(255,255,255,.03));
  border:1px solid rgba(255,140,26,.35);border-radius:16px;
  padding:16px 8px;min-height:118px;
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;
  backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);
  box-shadow:0 0 18px rgba(0,140,255,.18), inset 0 1px 0 rgba(255,255,255,.12);
  cursor:pointer;text-decoration:none;
  transition:transform .15s
}
.card:active{transform:scale(.97)}
.card .ico{font-size:38px}
.card p{color:#fff;font-size:13px;font-weight:600;text-align:center}

.btn{
  width:100%;height:56px;margin-top:auto;
  background:linear-gradient(90deg,#ff8c1a,#ffb347);border-radius:30px;
  display:flex;align-items:center;justify-content:center;
  color:#000;font-weight:800;font-size:20px;text-decoration:none;
  box-shadow:0 10px 30px rgba(255,140,26,.55);cursor:pointer
}
</style>
</head>
<body>
<div class="app">
  <!-- VIDEO QUI RECULE EN BOUCLE -->
  <video id="hero" autoplay muted playsinline loop preload="auto">
    <source src="https://files.catbox.moe/7kilum.mp4" type="video/mp4">
  </video>
  <div class="overlay"></div>

  <div class="content">
    <img class="logo" src="https://i.ibb.co/wh5qVgSz/IMG-20261002-WA2315.jpg" style="display:none" onload="this.style.display='block'" alt="">
    <!-- Si tu as le logo PNG transparent, mets le ici, sinon la video le montre déjà -->
    <div style="width:210px;height:210px;background:url('https://files.catbox.moe/7kilum.mp4') center/cover;border-radius:20px;display:none"></div>
    
    <h1>ADRYNX<span>Phoenix Prime</span></h1>
    <div class="s1">L'IA la plus vivante du Congo</div>
    <div class="s2">Creee par Jonathan Obenda a Brazzaville</div>

    <div class="grid">
      <a class="card" href="/app?mode=cours">
        <div class="ico">📖</div>
        <p>Expliquer les cours</p>
      </a>
      <a class="card" href="/app?mode=pdf">
        <div class="ico">📄</div>
        <p>Analyser un PDF</p>
      </a>
      <a class="card" href="/app?mode=image">
        <div class="ico">🖼️</div>
        <p>Generer des images</p>
      </a>
      <a class="card" href="/app?mode=vocal">
        <div class="ico">🎙️</div>
        <p>Chat vocal</p>
      </a>
    </div>

    <a class="btn" href="/app">Lancer ADRYNX</a>
  </div>
</div>

<script>
// BOUCLE SANS COUPURE
const v=document.getElementById('hero');
v.addEventListener('timeupdate',()=>{if(v.duration&&v.duration-v.currentTime<0.25){v.currentTime=0.05;v.play()}});
v.addEventListener('ended',()=>{v.currentTime=0;v.play()});

// S'assure que les boutons fonctionnent même si /app est en SPA
document.querySelectorAll('.card, .btn').forEach(b=>{
  b.addEventListener('click', (e)=>{
    // laisse le href faire son travail
    console.log('Go:', b.getAttribute('href'));
  });
});
</script>
</body>
</html>
