<!DOCTYPE html>
<html lang="fr"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ADRYNX ADMIN</title>
<style>
body{background:#050505;color:#fff;font-family:Inter,sans-serif;margin:0}
header{background:#111;padding:15px;border-bottom:1px solid #ff7a0033;display:flex;justify-content:space-between}
.card{background:#141414;border:1px solid #222;border-radius:12px;padding:15px;margin:12px}
button{background:#ff7a00;border:none;padding:8px 14px;border-radius:8px;color:#fff;font-weight:800;cursor:pointer}
table{width:100%;border-collapse:collapse} th,td{padding:8px;border-bottom:1px solid #222;text-align:left;font-size:13px}
input{padding:12px;background:#222;border:1px solid #333;border-radius:8px;color:#fff;width:90%}
</style>
</head><body>
<header><b>🔥 ADRYNX ADMIN</b><span id="st">Non connecté</span></header>
<div style="padding:10px">
<div id="login" class="card"><h3>Connexion</h3><input id="pwd" type="password" placeholder="Mot de passe"><br><br><button onclick="login()">Entrer</button></div>
<div id="dash" style="display:none">
<div class="card">Total Users: <b id="u">0</b> | Premium: <b id="p">0</b></div>
<div class="card"><h3>Utilisateurs</h3><table><thead><tr><th>ID</th><th>Date</th><th>Premium</th><th>Action</th></tr></thead><tbody id="ut"></tbody></table></div>
</div>
</div>
<script>
let TOK='';
function login(){
 fetch('/api/admin/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({password:document.getElementById('pwd').value})})
 .then(r=>r.json()).then(d=>{
   if(d.token){TOK=d.token; document.getElementById('login').style.display='none'; document.getElementById('dash').style.display='block'; document.getElementById('st').innerText='Connecté'; load();}
   else alert('Mauvais mot de passe');
 });
}
function load(){
 fetch('/api/admin/data',{headers:{'X-Admin-Token':TOK}}).then(r=>r.json()).then(d=>{
   document.getElementById('u').innerText=d.users.length;
   document.getElementById('p').innerText=d.users.filter(x=>x.premium).length;
   let t=document.getElementById('ut'); t.innerHTML='';
   d.users.forEach(u=>{ t.innerHTML+=`<tr><td>${u.id.slice(0,6)}</td><td>${u.date}</td><td>${u.premium?'✅':'❌'}</td><td><button onclick="setP('${u.id}')">Passer Premium</button></td></tr>` });
 });
}
function setP(id){ fetch('/api/admin/user',{method:'POST',headers:{'Content-Type':'application/json','X-Admin-Token':TOK},body:JSON.stringify({id,action:'premium'})}).then(()=>load()); }
</script>
</body></html>
