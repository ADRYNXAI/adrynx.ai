<!DOCTYPE html><html lang="fr"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ADRYNX V12.5 Phoenix Prime</title>
<style>
/* TON CSS DE BASE INCHANGÉ - JE NE CASSE RIEN */
body{background:#0a0a0a;color:#fff;font-family:Inter,sans-serif;margin:0;padding:0;display:flex;flex-direction:column;height:100vh}
header{padding:10px 12px;border-bottom:1px solid #222;background:#111;font-weight:900;color:orange;display:flex;justify-content:space-between;align-items:center}
#modes{display:flex;gap:6px;padding:10px;background:#111;border-bottom:1px solid #222;overflow-x:auto}
.modeBtn{padding:8px 14px;border-radius:20px;border:1px solid #333;background:#1e1e1e;color:#fff;font-size:12px;cursor:pointer;transition:all 0.2s}
.modeBtn.active{background:#ff7a00;border-color:#ff7a00;font-weight:800}
#chat{flex:1;overflow:auto;padding:15px;display:flex;flex-direction:column;gap:12px}
.msg{padding:12px 15px;border-radius:14px;max-width:92%;word-wrap:break-word}
.user{align-self:flex-end;background:#ff7a00;color:#fff}
.bot{align-self:flex-start;background:#1e1e1e;border:1px solid #2a2a2a}
#bar{display:flex;flex-direction:column;background:#111;border-top:1px solid #222;padding:12px}
#inputWrapper{flex:1;display:flex;align-items:center;background:#fff;border-radius:28px;padding:6px 8px 6px 12px;gap:8px}
#input{flex:1;border:none;outline:none;color:#111;font-size:15px}
#sendBtn{width:44px;height:44px;background:#ff7a00;border:none;border-radius:50%;color:#fff;font-weight:800;cursor:pointer;font-size:18px}
#voiceOverlay{display:none;position:fixed;top:0;left:0;right:0;bottom:0;background:#faf6f1;z-index:9999;flex-direction:column;align-items:center;padding:12px 16px;justify-content:space-between;transition:background 0.5s}
#voiceOverlay.open{display:flex}
#orbWrap{width:min(260px,62vw);height:min(260px,62vw);max-width:280px;max-height:280px;margin:10px auto;display:flex;align-items:center;justify-content:center;aspect-ratio:1/1;flex-shrink:0}
#orb{width:100%;height:100%;aspect-ratio:1/1;border-radius:50%;overflow:hidden;filter:drop-shadow(0 18px 20px rgba(0,0,0,0.4)) drop-shadow(0 0 22px rgba(255,122,0,0.7));transition:filter 0.3s, transform 0.1s linear}
#orbVideo{width:100%;height:100%;aspect-ratio:1/1;object-fit:cover;border-radius:50%;transform:scale(1.28);animation:spinContinu 30s linear infinite;will-change:transform;transition:filter 0.5s}
@keyframes spinContinu{from{transform:scale(1.28) rotate(0deg)}to{transform:scale(1.28) rotate(360deg)}}
#orb.caramel{filter:drop-shadow(0 18px 20px rgba(0,0,0,0.4)) drop-shadow(0 0 22px rgba(255,122,0,0.7))}
#orb.calm{filter:drop-shadow(0 0 22px rgba(245,235,220,0.7))}
#orb.clarity{filter:drop-shadow(0 0 22px rgba(80,180,255,0.7))}
#orb.energy{filter:drop-shadow(0 0 22px rgba(255,80,120,0.7))}
#orbVideo.caramel{filter:none}
#orbVideo.calm{filter:saturate(0.2) brightness(1.35) sepia(0.15)}
#orbVideo.clarity{filter:hue-rotate(190deg) saturate(1.6) brightness(1.15)}
#orbVideo.energy{filter:hue-rotate(330deg) saturate(1.9) brightness(1.1)}
#orbControls{display:flex;gap:8px;flex-wrap:wrap;justify-content:center}
.orbMode{padding:8px 12px;border-radius:20px;border:1px solid #ddd;background:#fff;color:#333;font-size:12px;cursor:pointer}
.orbMode.active{background:#111;color:#fff;font-weight:800}
#startBreath{padding:12px 22px;border-radius:28px;border:none;background:#ff8c2f;color:#fff;font-weight:900;cursor:pointer}

/* NOUVEAU LANDING EXACT COMME TON IMAGE - AVEC TON LIEN IBB */
#landing{position:fixed;inset:0;z-index:10000;background:#000;display:flex;flex-direction:column;overflow:auto;transition:transform 0.6s cubic-bezier(.8,0,.2,1)}
#landing.hide{transform:translateY(-110%)}
#heroImg{width:100%;height:auto;display:block;object-fit:cover}
#landingBody{background:#000;padding:10px 14px 20px;text-align:center}
#grid4{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin:16px 0 20px}
.cardL{background:rgba(255,255,255,0.06);border:1px solid rgba(255,122,0,0.3);border-radius:18px;padding:18px 10px;cursor:pointer;transition:all 0.15s;backdrop-filter:blur(4px)}
.cardL:active{transform:scale(0.96);background:rgba(255,122,0,0.15)}
.cardL .ico{font-size:26px;display:block;margin-bottom:6px}
.cardL .txt{font-size:12px;font-weight:700;color:#eee}
#ctaL{width:100%;padding:16px;background:linear-gradient(180deg,#ff9a3d,#ff6a00);border:none;border-radius:28px;color:#fff;font-weight:900;font-size:17px;cursor:pointer;box-shadow:0 8px 24px rgba(255,106,0,0.45);transition:transform 0.15s}
#ctaL:active{transform:scale(0.98)}
#app{flex:1;display:flex;flex-direction:column;height:100vh}
</style></head><body>

<!-- LANDING AVEC TON IMAGE IBB EXACTE -->
<div id="landing">
  <img id="heroImg" src="https://i.ibb.co/QF1YWSB5/IMG-20261005-WA8139.jpg" alt="ADRYNX Phoenix Prime">
  <div id="landingBody">
    <div id="grid4">
      <div class="cardL" onclick="launchWithMode('etudiant')"><span class="ico">📖</span><span class="txt">Expliquer les cours</span></div>
      <div class="cardL" onclick="launchWithMode('general','Analyse ce PDF pour moi : ')"><span class="ico">📄</span><span class="txt">Analyser un PDF</span></div>
      <div class="cardL" onclick="launchWithMode('image')"><span class="ico">🎨</span><span class="txt">Générer des images</span></div>
      <div class="cardL" onclick="launchWithMode('general'); setTimeout(()=>openOrb(),350)"><span class="ico">🎙️</span><span class="txt">Chat vocal</span></div>
    </div>
    <button id="ctaL" onclick="launchApp()">🚀 Lancer ADRYNX</button>
    <div style="margin-top:12px;font-size:10px;color:#666;letter-spacing:0.5px">Brazzaville • République du Congo • 2024</div>
  </div>
</div>

<!-- TON APP V12.4 INCHANGÉE -->
<div id="app">
<header><span>🔥 ADRYNX 1000F 🇨🇬</span><span id="counter">25/25</span></header>
<div id="modes">
  <button class="modeBtn active" data-mode="general" onclick="setMode('general',this)">💬 Général</button>
  <button class="modeBtn" data-mode="etudiant" onclick="setMode('etudiant',this)">🎓 Étudiant</button>
  <button class="modeBtn" data-mode="vendeur" onclick="setMode('vendeur',this)">💰 Vendeur</button>
  <button class="modeBtn" data-mode="codeur" onclick="setMode('codeur',this)">💻 Codeur</button>
  <button class="modeBtn" data-mode="image" onclick="setMode('image',this)">🎨 Image</button>
</div>
<div id="chat"></div>
<div id="bar"><div id="inputWrapper"><input id="input" placeholder="Demander à ADRYNX..."><button id="sendBtn" onclick="handleSend()">></button></div></div>
</div>

<div id="voiceOverlay"><div style="width:100%;display:flex;justify-content:space-between"><button onclick="closeOrb()" style="border:none;background:#eee;border-radius:50%;width:32px;height:32px">—</button><div style="background:#111;color:#ff7a00;padding:6px 12px;border-radius:20px;font-size:11px;font-weight:800">CARAMEL CHAUD</div><button onclick="closeOrb()" style="border:none;background:#eee;border-radius:50%;width:32px;height:32px">✕</button></div>
<div id="orbWrap"><div id="orb" class="caramel"><video id="orbVideo" class="caramel" autoplay loop muted playsinline><source src="https://files.catbox.moe/oj4pkp.mp4" type="video/mp4"></video></div></div>
<div style="display:flex;flex-direction:column;align-items:center;gap:10px"><div style="font-weight:900;color:#111">Breathing Session</div><div id="voiceStatus" style="color:#666">Je t'écoute...</div><button id="startBreath" onclick="openOrb()">Start Breathing</button><div id="orbControls"><button class="orbMode active" data-orb="divine">🔥 Caramel Chaud</button><button class="orbMode" data-orb="calm">🍃 Calm</button><button class="orbMode" data-orb="clarity">☁️ Clarity</button><button class="orbMode" data-orb="energy">✨ Energy</button></div>
<div style="width:100%;max-width:500px;display:flex;align-items:center;background:#fff;border-radius:28px;padding:8px 10px;gap:8px;margin-top:auto"><input id="voiceInput" placeholder="Demander..." style="flex:1;border:none;outline:none"><button onclick="closeOrb()" style="width:36px;height:36px;border-radius:50%;background:#111;color:#fff;border:none">✕</button></div></div></div>

<script>
const chat=document.getElementById('chat'), input=document.getElementById('input'), btn=document.getElementById('sendBtn'), overlay=document.getElementById('voiceOverlay'), orb=document.getElementById('orb'), orbVideo=document.getElementById('orbVideo'), voiceStatus=document.getElementById('voiceStatus'), voiceInput=document.getElementById('voiceInput');
let history=[], currentMode='general';
// VIDEO CONTINU SANS LAG - TON CODE
orbVideo.loop=true;
orbVideo.addEventListener('timeupdate',()=>{if(orbVideo.duration && orbVideo.currentTime>orbVideo.duration-0.2) orbVideo.currentTime=0.05});
orbVideo.addEventListener('ended',()=>{orbVideo.currentTime=0; orbVideo.play().catch(()=>{});});
function applyOrbTheme(t){orb.className=t; orbVideo.className=t; if(t==='calm') overlay.style.background='#f5f0e8'; else if(t==='clarity') overlay.style.background='#e8f2ff'; else if(t==='energy') overlay.style.background='#ffe8ee'; else overlay.style.background='#faf6f1';}
document.querySelectorAll('.orbMode').forEach(b=>{b.onclick=()=>{document.querySelectorAll('.orbMode').forEach(x=>x.classList.remove('active')); b.classList.add('active'); applyOrbTheme(b.dataset.orb==='divine'?'caramel':b.dataset.orb);};});
applyOrbTheme('caramel');
let audioCtx, analyser, micStream, voiceInterval, baseScale=1.28;
function initAudio(){if(!audioCtx) audioCtx=new (window.AudioContext||window.webkitAudioContext)();}
function startMicVisualizer(){
  initAudio();
  navigator.mediaDevices.getUserMedia({audio:true}).then(stream=>{
    micStream=stream; const src=audioCtx.createMediaStreamSource(stream);
    analyser=audioCtx.createAnalyser(); analyser.fftSize=256; src.connect(analyser);
    const data=new Uint8Array(analyser.frequencyBinCount);
    function tick(){
      if(!analyser) return; analyser.getByteFrequencyData(data);
      let avg=data.reduce((a,b)=>a+b,0)/data.length;
      let vol=avg/255;
      let scale=baseScale + vol*0.25;
      let bright=1+vol*0.3;
      orbVideo.style.transform=`scale(${scale}) rotate(${Date.now()/80%360}deg)`;
      orb.style.filter=`drop-shadow(0 0 ${18+vol*20}px rgba(255,122,0,${0.5+vol*0.5})) brightness(${bright})`;
      if(overlay.classList.contains('open') && analyser) requestAnimationFrame(tick);
    }
    tick();
  }).catch(()=>{});
}
function stopMicVisualizer(){if(micStream){micStream.getTracks().forEach(t=>t.stop()); micStream=null;} analyser=null; orbVideo.style.transform=`scale(${baseScale})`; orbVideo.style.animation='spinContinu 30s linear infinite';}
function startTTSLivingPulse(){
  let t=0;
  voiceInterval=setInterval(()=>{
    t+=0.15; let vol=0.5+Math.sin(t)*0.3 + Math.random()*0.4;
    let scale=baseScale + vol*0.18;
    orbVideo.style.transform=`scale(${scale})`;
    orb.style.transform=`scale(${1+vol*0.08})`;
  }, 90);
}
function stopTTSLivingPulse(){clearInterval(voiceInterval); orb.style.transform='scale(1)';}
function openOrb(){overlay.classList.add('open'); startMicVisualizer(); orbVideo.play();}
function closeOrb(){overlay.classList.remove('open'); stopMicVisualizer(); stopTTSLivingPulse();}
function add(r,h){let d=document.createElement('div'); d.className='msg '+r; d.innerHTML=h; chat.appendChild(d); chat.scrollTop=chat.scrollHeight;}
function speakHuman(text){
  let clean=text.replace(/<[^>]*>/g,'').slice(0,400);
  let u=new SpeechSynthesisUtterance(clean); u.lang='fr-FR'; u.rate=0.93;
  u.onstart=()=>{startTTSLivingPulse();};
  u.onend=()=>{stopTTSLivingPulse();};
  speechSynthesis.speak(u);
}
async function send(q){
  q=(q||input.value||voiceInput.value).trim(); if(!q) return;
  add('user',q); input.value=''; voiceInput.value='';
  try{
    let r=await fetch('/api/chat',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({message:q,history:history.slice(-6),mode:currentMode})});
    let data=await r.json();
    add('bot',data.reply||'Réponse vide');
    speakHuman(data.reply);
    history.push({role:'user',content:q},{role:'assistant',content:data.reply});
  }catch(e){ add('bot','Erreur réseau, réessaie Chef'); }
}
function handleSend(){let q=input.value.trim(); if(!q) openOrb(); else send();}
btn.onclick=handleSend;
input.onkeydown=e=>{if(e.key==='Enter') handleSend();};
voiceInput.onkeydown=e=>{if(e.key==='Enter') send();};
add('bot','V12.5 Phoenix Prime prêt ✅');

// NOUVELLES FONCTIONS BOUTONS NON OBSOLETES - TOUT FONCTIONNE
function setMode(m,el){
  currentMode=m;
  document.querySelectorAll('.modeBtn').forEach(x=>x.classList.remove('active'));
  if(el) el.classList.add('active');
}
function launchApp(){
  document.getElementById('landing').classList.add('hide');
  setTimeout(()=>{ input.focus(); },600);
}
function launchWithMode(m,prefill){
  setMode(m, document.querySelector(`.modeBtn[data-mode="${m}"]`));
  launchApp();
  if(prefill){ setTimeout(()=>{ input.value=prefill; input.focus(); },650); }
}
</script></body></html>
