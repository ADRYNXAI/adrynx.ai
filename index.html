<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>ADRYNX Phoenix</title>

<link rel="stylesheet" href="/style.css?v=8">

<style>
body {
    margin: 0;
    background: #05050A;
    color: #ffffff;
    font-family: Arial, sans-serif;
    display: flex;
    min-height: 100vh;
}

.sidebar {
    width: 300px;
    background: #111111;
    padding: 20px;
    border-right: 1px solid #222222;
    box-sizing: border-box;
}

.main {
    flex: 1;
    padding: 20px;
    box-sizing: border-box;
}

.card {
    background: #1a1a1a;
    border-radius: 12px;
    padding: 12px;
    margin-bottom: 10px;
}

video {
    width: 100%;
    border-radius: 12px;
    display: block;
}

.btn {
    background: #00ff88;
    color: #000000;
    padding: 12px;
    width: 100%;
    border: 0;
    border-radius: 8px;
    font-weight: 800;
    cursor: pointer;
}

.btn:hover {
    opacity: 0.9;
}

#chat {
    min-height: 300px;
    max-height: 60vh;
    overflow-y: auto;
    padding: 5px;
}

.message {
    padding: 10px;
    margin: 8px 0;
    border-radius: 8px;
    line-height: 1.5;
}

.user {
    background: #222222;
}

.assistant {
    background: #101b16;
}

.error {
    background: #351515;
    color: #ff8f8f;
}

.input-area {
    display: flex;
    gap: 8px;
    margin-top: 12px;
}

#q {
    flex: 1;
    padding: 10px;
    background: #111111;
    border: 1px solid #333333;
    color: #ffffff;
    border-radius: 6px;
    box-sizing: border-box;
}

.send {
    padding: 10px 18px;
    cursor: pointer;
}

#status {
    margin-top: 10px;
    font-size: 13px;
    color: #aaaaaa;
}

#log {
    white-space: pre-wrap;
}
</style>

</head>

<body>

<div class="sidebar">

    <h2>ADRYNX.</h2>

    <div class="card" style="padding: 0; overflow: hidden;">

        <video
            src="https://files.catbox.moe/y2nvi4.mp4"
            autoplay
            muted
            loop
            playsinline>
        </video>

        <div style="padding: 10px;">
            🔥 PHOENIX LIVE
        </div>

    </div>

    <button class="btn" onclick="ask('Cc')">
        TEST CC
    </button>

</div>


<div class="main">

    <h1>ADRYNX v7.0</h1>

    <div class="card">

        <div id="chat"></div>

        <div class="input-area">

            <input
                id="q"
                autocomplete="off"
                placeholder="Écris un message à ADRYNX..."
            >

            <button class="send" onclick="send()">
                Envoyer
            </button>

        </div>

        <div id="status">
            État : prêt
        </div>

    </div>

    <pre id="log">> Ready</pre>

</div>


<script src="/app.js?v=8" defer></script>

</body>
</html>
