<!DOCTYPE html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>ADRYNX Community</title><link rel="manifest" href="/manifest.json">
<style>
*{margin:0;padding:0;box-sizing:border-box}body{background:#000;color:#fff;font-family:Inter,sans-serif;height:100vh;overflow:hidden}
#phoenix-video{position:fixed;top:0;left:0;width:100%;height:100%;object-fit:cover;filter:brightness(0.4) blur(2px)}
.core{position:relative;z-index:2;max-width:720px;margin:0 auto;height:100vh;display:flex;flex-direction:column;padding:20px}
h1{font-size:2.2rem;letter-spacing:12px;text-align:center;text-shadow:0 0 20px #ff6a00}
#orb-wrap{width:160px;height:160px;margin:10px auto;position:relative}
#orb-video{width:100%;height:100%;border-radius:50%;object-fit:cover;animation:breatheVivant 3.8s ease-in-out infinite,spinContinu 30s linear infinite;box-shadow:0 0 30px rgba(255,106,0,0.6)}
@keyframes breatheVivant{0%,100%{transform:scale(1)}50%{transform:scale(1.28)}}
@keyframes spinContinu{from{transform:rotate(0deg) scale(1)}50%{transform:rotate(180deg) scale(1.28)}to{transform:rotate(360deg) scale(1)}}
.modes{display:flex;gap:6px;overflow-x:auto;padding:8px 0}.modes button{background:rgba(255,255,255,0.08);border:1px solid rgba(255,255,255,0.1);color:#fff;padding:6px 12px;border-radius:20px;font-size:0.8rem}
.modes button.active{background:rgba(255,106,0,0.2);border-color:#ff6a00}
#community-bar{display:flex;gap:8px;overflow-x:auto;padding:10px 0;border-top:1px solid rgba(255,106,0,0.2);margin-top:8px}
#community-bar button{padding:8px 14px;border-radius:20px;border:none;color:#fff;cursor:pointer;font-size:0.85rem}
#chat{flex:1;overflow-y:auto;display:flex;flex-direction:column;gap:10px;padding:10px}
.message{padding:10px 14px;border-radius:16px;max-width:85%;animation:pop 0.3s}.user{align-self:flex-end;background:rgba(255,255,255,0.1)}.assistant{align-self:flex-start;background:rgba(255,106,0,0.15);border:1px solid rgba(255,106,0,0.3)}
.input-zone{display:flex;gap:10px;background:rgba(255,255,255,0.08);backdrop-filter:blur(20px);padding:12px;border-radius:24px;border:1px solid rgba(255,255,255,0.1)}
#q{flex:1;background:transparent;border:none;color:#fff;outline:none}#community-feed{max-height:28vh;overflow-y:auto;background:rgba(0,0,0,0.6);border-radius:12px;margin-top:6px;display:none}
@keyframes pop{from{transform:scale(0.9);opacity:0}to{transform:scale(1);opacity:1}}
</style></head><body>
<video id="phoenix-video" autoplay muted loop playsinline><source src="/orb.mp4"></video>
<div class="core">
<h1>ADRYNX</h1>
<div id="orb-wrap"><video id="orb-video" autoplay muted loop playsinline><source src="/orb.mp4"></video></div>
<div class="modes">
<button class="active" onclick="setMode('general')">General</button>
<button onclick="setMode('etudiant')">Etudiant</button>
<button onclick="setMode('vendeur')">Vendeur</button>
<button onclick="setMode('codeur')">Codeur</button>
<button onclick="setMode('image')">Image</button>
</div>
<div id="community-bar">
<button onclick="loadFeed()" style="background:rgba(255,106,0,0.25);border:1px solid #ff6a00">🌍 Feed</button>
<button onclick="askCommunity()" style="background:rgba(255,255,255,0.08)">❓ Poser</button>
<button onclick="loadAstuces()" style="background:rgba(255,255,255,0.08)">💡 Astuces</button>
<button onclick="loadTop()" style="background:rgba(255,255,255,0.08)">🏆 Top</button>
</div>
<div id="community-feed"></div>
<div id="chat"></div>
<div class="input-zone"><input id="q" placeholder="Parle à ADRYNX..."><button onclick="send()">➤</button></div>
</div>
<script>
let mode='general'; const uid=localStorage.user_id||(localStorage.user_id='user_'+Math.random().toString(36).slice(2,8));
function setMode(m){mode=m;document.querySelectorAll('.modes button').forEach(b=>b.classList.remove('active'));event.target.classList.add('active')}
async function send(){let i=document.getElementById('q');let t=i.value;if(!t)return;i.value='';let c=document.getElementById('chat');c.innerHTML+=`<div class="message user">${t}</div>`;let r=await fetch('/api/chat',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({message:t,user_id:uid,mode})}).then(r=>r.json());c.innerHTML+=`<div class="message assistant">${r.reponse}</div>`;c.scrollTop=c.scrollHeight}
async function loadFeed(){let f=document.getElementById('community-feed');f.style.display='block';f.innerHTML='Chargement...';let r=await fetch('/api/community/feed').then(r=>r.json());f.innerHTML=r.map(x=>`<div style="padding:10px;border-bottom:1px solid rgba(255,255,255,0.1)"><b>${x.uid}</b> <small>${x.time}</small><br>${x.q}<br><small style="color:#ff6a00">${x.r}</small></div>`).join('')||'Aucune question. Sois le 1er dev Congo!';}
async function askCommunity(){let q=prompt('Ta question Dev Congo?');if(!q)return;let r=prompt('Ta réponse / astuce?');if(!r)return;await fetch('/api/community/post',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({user_id:uid,q,r})});loadFeed();}
async function loadAstuces(){let f=document.getElementById('community-feed');f.style.display='block';let r=await fetch('/api/community/astuces').then(r=>r.json());f.innerHTML=r.map(x=>`<div style="padding:10px;background:rgba(255,106,0,0.1);margin:4px;border-radius:8px"><b>${x.t}</b><br>${x.c}</div>`).join('');}
async function loadTop(){let f=document.getElementById('community-feed');f.style.display='block';let r=await fetch('/api/community/top').then(r=>r.json());f.innerHTML=r.map((x,i)=>`<div style="padding:8px">#${i+1} ${x.uid} - ${x.count} posts</div>`).join('')||'Pas encore de Top';}
document.getElementById('q').addEventListener('keydown',e=>{if(e.key==='Enter')send()});
if('serviceWorker' in navigator){navigator.serviceWorker.register('/sw.js');}
</script></body></html>
