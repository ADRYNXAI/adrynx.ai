<!DOCTYPE html><html lang="fr"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ADRYNX Phoenix Prime - Netflix des IA</title>
<style>
body{background:#0a0a0a;color:#fff;font-family:Inter,sans-serif;margin:0;padding:0;display:flex;flex-direction:column;height:100vh}
header{padding:10px 12px;text-align:center;border-bottom:1px solid #222;background:#111;font-weight:900;color:orange;letter-spacing:0.5px;display:flex;justify-content:space-between;align-items:center;gap:8px}
#modes{display:flex;gap:6px;padding:10px;background:#111;border-bottom:1px solid #222;overflow-x:auto;scrollbar-width:none}
.modeBtn{padding:8px 14px;border-radius:20px;border:1px solid #333;background:#1e1e1e;color:#fff;font-size:12px;cursor:pointer;white-space:nowrap;transition:0.2s}
.modeBtn.active{background:#ff7a00;border-color:#ff7a00;font-weight:800;transform:scale(1.05)}
#chat{flex:1;overflow:auto;padding:15px;display:flex;flex-direction:column;gap:12px}
.msg{padding:12px 15px;border-radius:14px;max-width:92%;line-height:1.4;word-wrap:break-word;position:relative}
.user{align-self:flex-end;background:#ff7a00;color:#fff;border-bottom-right-radius:4px}
.bot{align-self:flex-start;background:#1e1e1e;border:1px solid #2a2a2a;border-bottom-left-radius:4px}
.bot a{color:#ff7a00;text-decoration:none;font-weight:700}
#bar{display:flex;flex-direction:column;background:#111;border-top:1px solid #222;padding:12px}
#inputWrapper{flex:1;display:flex;align-items:center;background:#fff;border-radius:28px;border:1.5px solid #e5e7eb;padding:6px 8px 6px 12px;gap:8px;box-shadow:0 4px 20px rgba(0,0,0,0.15)}
#plusBtn{width:36px;height:36px;border:none;background:none;font-size:32px;color:#111;cursor:pointer;border-radius:50%}
#input{flex:1;padding:10px 4px;border:none;background:transparent;color:#111;outline:none;font-size:16px}
#input::placeholder{color:#9aa0a6}
#micBtn{width:36px;height:36px;border:none;background:none;font-size:20px;cursor:pointer;border-radius:50%;display:flex;align-items:center;justify-content:center}
#micBtn.listening{animation:pulse 1s infinite;background:#ff7a0022}
#sendBtn{width:44px;height:44px;background:#ff7a00;border:none;border-radius:50%;color:#fff;font-weight:800;cursor:pointer;display:flex;align-items:center;justify-content:center;flex-shrink:0;box-shadow:0 2px 8px rgba(255,122,0,0.4)}
@keyframes pulse{0%{transform:scale(1)}50%{transform:scale(1.1)}100%{transform:scale(1)}}
#voiceToggle{padding:5px 10px;border-radius:20px;border:1px solid #ff7a00;background:#1e1e1e;color:#ff7a00;font-size:11px;font-weight:800;cursor:pointer}
#voiceToggle.on{background:#ff7a00;color:#fff}
#counter{font-size:10px;background:#1e1e1e;border:1px solid #333;padding:5px 10px;border-radius:20px;color:#aaa;white-space:nowrap}
#counter.low{background:#ff222211;border-color:#ff2222;color:#ff6666}
#counter.premium{background:#ff7a0022;border-color:#ff7a00;color:#ff7a00}
.speakBtn{margin-left:8px;padding:2px 8px;border-radius:12px;border:1px solid #333;background:#222;color:#ff7a00;font-size:11px;cursor:pointer}
#fileName{font-size:11px;color:#ff7a00;padding:0 0 8px 12px;display:none}
/* ORBE INSPIRÉE DE LA TIENNE - VIVANTE - CENTRÉE - 100% SAFE */
#voiceOverlay{display:none;position:fixed;top:0;left:0;right:0;bottom:0;background:#faf6f1;z-index:9999;flex-direction:column;align-items:center;justify-content:flex-start;padding:12px 16px;overflow:hidden}
#voiceOverlay.open{display:flex}
#orb{width:min(310px,78vw);height:min(310px,78vw);min-width:260px;min-height:260px;margin:auto;flex-shrink:0;border-radius:50%;background:radial-gradient(ellipse at 22% 28%, rgba(255,255,255,0.98) 0 14%, rgba(255,255,255,0.55) 20%, transparent 36%),radial-gradient(ellipse at 76% 64%, rgba(255,255,255,0.88) 0 13%, transparent 30%),radial-gradient(ellipse at 45% 85%, rgba(255,255,255,0.5) 0 10%, transparent 24%),radial-gradient(circle at 32% 22%, #ffd9a6 0%, #ff9a3d 18%, #ff7a00 28%, #ff4a00 52%, #ff8c33 80%, #fff7ec 100%);box-shadow:0 0 95px rgba(255,122,0,0.6), inset 0 0 45px rgba(255,255,255,0.85);position:relative;overflow:hidden;animation:adrynxBreath 1.7s ease-in-out infinite}
#orb::before{content:'';position:absolute;top:-12%;left:-12%;width:124%;height:72%;background:radial-gradient(ellipse, rgba(255,255,255,0.9) 0%, rgba(255,255,255,0.35) 38%, transparent 68%);animation:cloudDrift 4.5s ease-in-out infinite alternate}
#orb::after{content:'';position:absolute;inset:-34px;border-radius:50%;background:radial-gradient(circle, rgba(255,122,0,0.48) 0%, rgba(255,122,0,0.12) 40%, transparent 70%);animation:adrynxGlow 1.7s ease-in-out infinite;z-index:-1}
#orb.speaking{animation:orbPulseFast 0.6s ease-in-out infinite!important}
@keyframes adrynxBreath{0%{transform:scale(1)}50%{transform:scale(1.2);filter:brightness(1.22)}100%{transform:scale(1)}}
@keyframes orbPulseFast{0%{transform:scale(1.06)}50%{transform:scale(1.32);filter:brightness(1.32)}100%{transform:scale(1.06)}}
@keyframes adrynxGlow{0%{transform:scale(0.8);opacity:0.5}50%{transform:scale(1.42);opacity:1}100%{transform:scale(0.8);opacity:0.5}}
@keyframes cloudDrift{0%{transform:translateX(-9px) translateY(3px)}100%{transform:translateX(9px) translateY(-3px)}}
#voiceClose{width:44px;height:44px;background:#111;border:none;border-radius:50%;color:#fff;font-size:20px;cursor:pointer}
</style>
</head><body>
<header><span>🔥 ADRYNX 1000F 🇨🇬</span><div style="display:flex;gap:6px;align-items:center"><span id="counter">25/25</span><button id="voiceToggle" class="on">🔊</button></div></header>
<div id="modes"><button class="modeBtn active" data-mode="general">💬 Général</button><button class="modeBtn" data-mode="etudiant">🎓 Étudiant</button><button class="modeBtn" data-mode="vendeur">💰 Vendeur</button><button class="modeBtn" data-mode="codeur">💻 Codeur</button><button class="modeBtn" data-mode="image">🎨 Image 4K</button></div>
<div id="chat"></div>
<div id="bar"><div id="fileName"></div><div id="inputWrapper"><button id="plusBtn">+</button><input id="input" placeholder="Demander à ADRYNX..."><button id="micBtn">🎙️</button><button id="sendBtn">)))</button></div><input type="file" id="fileInput" hidden accept=".pdf,.docx,.doc,.txt,.csv,.xlsx,.xls,.png,.jpg,.jpeg,.webp"></div>
<div id="voiceOverlay"><div style="width:100%;display:flex;justify-content:space-between"><button onclick="closeOrb()" style="width:36px;height:36px;border-radius:50%;border:none;background:#fff">—</button><button style="width:36px;height:36px;border-radius:50%;border:none;background:#fff">⤢</button></div><div id="orb"></div><div style="width:100%;display:flex;flex-direction:column;gap:12px;align-items:center"><div id="voiceStatus" style="font-size:14px;color:#666;font-weight:600">Parle à ADRYNX...</div><div style="width:100%;max-width:500px;display:flex;align-items:center;background:#fff;border-radius:28px;border:1px solid #e5e7eb;padding:8px 10px;gap:8px"><button style="border:none;background:none;font-size:22px">+</button><input id="voiceInput" placeholder="Demander à ADRYNX..." style="flex:1;border:none;outline:none"><button id="voiceClose" onclick="closeOrb()">✕</button></div></div></div>
<script>
const chat=document.getElementById('chat'), input=document.getElementById('input'), btn=document.getElementById('sendBtn'), voiceToggle=document.getElementById('voiceToggle'), counterEl=document.getElementById('counter'), plusBtn=document.getElementById('plusBtn'), fileInput=document.getElementById('fileInput'), micBtn=document.getElementById('micBtn'), fileNameEl=document.getElementById('fileName'), overlay=document.getElementById('voiceOverlay'), orb=document.getElementById('orb'), voiceStatus=document.getElementById('voiceStatus'), voiceInput=document.getElementById('voiceInput');
let history=[], currentMode='general', voiceEnabled=localStorage.getItem('adrynx_voice')!=='off', bestVoice=null, attachedFileContent=null, attachedFileName=null;
const LIMIT=25; let userId=localStorage.getItem('adrynx_uid'); if(!userId){ userId='user_'+Math.random().toString(36).substring(2,10); localStorage.setItem('adrynx_uid', userId); } if(window.location.search.includes('jonathan')) userId='jonathan_admin_unlimited'; const isAdmin = userId==='jonathan_admin_unlimited';
function getToday(){return new Date().toISOString().slice(0,10);} function loadCount(){ if(isAdmin) return {count:0,date:getToday()}; let d=JSON.parse(localStorage.getItem('adrynx_count_v2')||'{}'); if(d.date!==getToday()) return {count:0,date:getToday()}; return d; } function saveCount(c){localStorage.setItem('adrynx_count_v2', JSON.stringify({count:c,date:getToday()}));}
function updateCounter(){ if(isAdmin){ counterEl.innerText='∞ ILLIMITÉ'; counterEl.className='premium'; return; } let {count}=loadCount(); let rest=LIMIT-count; counterEl.innerText=rest>0?rest+'/25 restants':'0/25 - Premium?'; counterEl.className=rest<=5?'low':''; if(rest<=0){ input.placeholder='Limite atteinte - Passe Premium 1000F'; input.disabled=true; btn.disabled=true; btn.innerText='!'; btn.onclick=()=>location.href='/pay'; } } updateCounter();
function loadVoices(){const voices=speechSynthesis.getVoices(); if(!voices.length) return; const fr=voices.filter(v=>v.lang.toLowerCase().includes('fr')); const prio=['Google français','Amélie','Thomas','Hortense','Paul']; for(let n of prio){let f=fr.find(v=>v.name.includes(n)); if(f){bestVoice=f; break;}} if(!bestVoice&&fr.length) bestVoice=fr[0];}
if('speechSynthesis' in window){loadVoices(); speechSynthesis.onvoiceschanged=loadVoices;}
function updateVoiceBtn(){voiceToggle.innerText=voiceEnabled?'🔊':'🔇'; voiceToggle.className=voiceEnabled?'on':''; localStorage.setItem('adrynx_voice', voiceEnabled?'on':'off');}
updateVoiceBtn(); voiceToggle.onclick=()=>{voiceEnabled=!voiceEnabled; if(!voiceEnabled) speechSynthesis.cancel(); updateVoiceBtn();};
function speakHuman(text){if(!voiceEnabled) return; if(!('speechSynthesis' in window)) return; speechSynthesis.cancel(); let clean=text.replace(/<[^>]*>/g,'').replace(/https?:\/\/\S+/g,'').slice(0,350).trim(); if(!clean) return; const u=new SpeechSynthesisUtterance(clean); if(bestVoice) u.voice=bestVoice; u.lang='fr-FR'; u.rate=0.93; u.pitch=1.02; orb.classList.add('speaking'); u.onend=()=>orb.classList.remove('speaking'); speechSynthesis.speak(u);}
document.querySelectorAll('.modeBtn').forEach(b=>{b.onclick=()=>{document.querySelectorAll('.modeBtn').forEach(x=>x.classList.remove('active')); b.classList.add('active'); currentMode=b.dataset.mode; add('bot','✅ Mode <b>'+b.innerText+'</b> activé.');}});
function add(role, html){ let d=document.createElement('div'); d.className='msg '+role; if(role==='bot') d.innerHTML=html+' <button class="speakBtn" onclick="speakHuman(this.parentNode.innerText)">🔊</button>'; else d.innerHTML=html; chat.appendChild(d); chat.scrollTop=chat.scrollHeight; if(role==='bot') speakHuman(html); }
plusBtn.onclick=()=>fileInput.click();
fileInput.onchange=async (e)=>{ const file=e.target.files[0]; if(!file) return; fileNameEl.style.display='block'; fileNameEl.innerText='📎 '+file.name+' lecture...'; attachedFileName=file.name; try{ if(file.type.startsWith('text/')||file.name.match(/\.(csv|txt)$/i)){ attachedFileContent=await file.text(); } else if(file.name.match(/\.(png|jpg|jpeg|webp)$/i)){ const r=new FileReader(); attachedFileContent=await new Promise(res=>{r.onload=()=>res(r.result); r.readAsDataURL(file);}); } else { try{ attachedFileContent=await file.text(); if(attachedFileContent.length<20) throw 'bin'; }catch{ attachedFileContent='[FICHIER: '+file.name+']'; } } fileNameEl.innerText='✅ 📎 '+file.name+' prêt'; input.placeholder='Question sur '+file.name+'...'; }catch(err){ fileNameEl.innerText='⚠️ '+err; } };
function clearFile(){ attachedFileContent=null; attachedFileName=null; fileNameEl.style.display='none'; fileInput.value=''; input.placeholder='Demander à ADRYNX...'; }
let recognition=null; if('webkitSpeechRecognition' in window || 'SpeechRecognition' in window){ const SR=window.SpeechRecognition||window.webkitSpeechRecognition; recognition=new SR(); recognition.lang='fr-FR'; recognition.onstart=()=>{micBtn.classList.add('listening'); orb.classList.add('listening'); voiceStatus.innerText='Je t\'écoute...';}; recognition.onend=()=>{micBtn.classList.remove('listening'); orb.classList.remove('listening'); voiceStatus.innerText='Parle à ADRYNX...';}; recognition.onresult=(ev)=>{ let t=ev.results[0][0].transcript; input.value=t; voiceInput.value=t; if(overlay.classList.contains('open')) send(t); }; }
micBtn.onclick=()=>{ if(!recognition){ add('bot','🎤 Utilise Chrome'); return; } try{ recognition.start(); }catch{ recognition.stop(); } };
function openOrb(){ overlay.classList.add('open'); if(recognition) try{recognition.start();}catch{} }
function closeOrb(){ overlay.classList.remove('open'); speechSynthesis.cancel(); orb.classList.remove('speaking'); }
async function send(forcedQ){ let q=(forcedQ||input.value||voiceInput.value).trim(); if(!q &&!attachedFileContent) return; if(!isAdmin){let {count}=loadCount(); if(count>=LIMIT){ add('bot','🔒 <b>Limite 25/jour atteinte</b><br>Passe Premium 1000F/semaine → <a href="/pay">PAYER MAINTENANT</a>'); return; }} let fullQ=q; if(attachedFileContent){ if(attachedFileContent.startsWith('data:image')) fullQ=(q||'Analyse image')+'\n[IMAGE: '+attachedFileName+']'; else fullQ=(q||'Analyse fichier')+'\n--- FICHIER '+attachedFileName+' ---\n'+attachedFileContent.slice(0,15000)+'\n--- FIN ---'; } add('user', (attachedFileName?'📎 <b>'+attachedFileName+'</b><br>':'')+ (q||'(analyse)')); history.push({role:'user', content:fullQ}); input.value=''; voiceInput.value=''; btn.disabled=true; let loading=document.createElement('div'); loading.className='msg bot'; loading.innerText='⚡ ADRYNX '+currentMode+' analyse...'; chat.appendChild(loading); chat.scrollTop=chat.scrollHeight; try{ let payload={message:fullQ,history:history.slice(-6),isPremium:isAdmin,mode:currentMode}; if(attachedFileContent && attachedFileContent.startsWith('data:image')) payload.image=attachedFileContent; let r=await fetch('/api/chat',{method:'POST',headers:{'Content-Type':'application/json','X-User-Id': userId},body:JSON.stringify(payload)}); let data=await r.json(); loading.remove(); if(data.limit_reached){ add('bot', data.reply); input.disabled=true; btn.disabled=true; btn.innerText='!'; btn.onclick=()=>location.href='/pay'; counterEl.innerText='0/25'; counterEl.className='low'; return; } add('bot', data.reply); history.push({role:'assistant', content:data.reply}); if(!isAdmin){let cur=loadCount(); cur.count=(cur.count||0)+1; saveCount(cur.count); updateCounter();} clearFile(); }catch(e){loading.remove(); add('bot','Erreur: '+e.message);} btn.disabled=false; input.focus(); }
btn.onclick=()=>{ let q=input.value.trim(); if(!q &&!attachedFileContent){ openOrb(); } else { send(); } };
input.onkeydown=e=>{if(e.key==='Enter') send();};
voiceInput.onkeydown=e=>{if(e.key==='Enter') send();};
add('bot','Salut 👋 Je suis <b>ADRYNX Phoenix Prime</b>, créée par Jonathan Dejah OBENDA.<br><br>🎁 <b>Gratuit :</b> 25 messages/jour + 3 images HD<br>💎 <b>Premium 1000F/semaine :</b> TOUT illimité<br><br>📎 <b>+</b> = fichier | 🎙️ = dictée | 🟠 ))) vide = ORBE SOLEIL<br><br>Essaye: <b>génère image Brazzaville futuriste</b>');
</script>
</body></html>
