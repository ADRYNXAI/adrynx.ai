<!DOCTYPE html><html lang="fr"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ADRYNX Phoenix Prime - Soleil Dieu V3</title>
<style>
body{background:#0a0a0a;color:#fff;font-family:Inter,sans-serif;margin:0;padding:0;display:flex;flex-direction:column;height:100vh}
header{padding:10px 12px;border-bottom:1px solid #222;background:#111;font-weight:900;color:orange;display:flex;justify-content:space-between;align-items:center}
#modes{display:flex;gap:6px;padding:10px;background:#111;border-bottom:1px solid #222;overflow-x:auto;scrollbar-width:none}
.modeBtn{padding:8px 14px;border-radius:20px;border:1px solid #333;background:#1e1e1e;color:#fff;font-size:12px;cursor:pointer;white-space:nowrap}
.modeBtn.active{background:#ff7a00;border-color:#ff7a00;font-weight:800}
#chat{flex:1;overflow:auto;padding:15px;display:flex;flex-direction:column;gap:12px}
.msg{padding:12px 15px;border-radius:14px;max-width:92%;line-height:1.4;word-wrap:break-word}
.user{align-self:flex-end;background:#ff7a00;color:#fff}
.bot{align-self:flex-start;background:#1e1e1e;border:1px solid #2a2a2a}
#bar{display:flex;flex-direction:column;background:#111;border-top:1px solid #222;padding:12px}
#inputWrapper{flex:1;display:flex;align-items:center;background:#fff;border-radius:28px;padding:6px 8px 6px 12px;gap:8px;box-shadow:0 4px 20px rgba(0,0,0,0.15)}
#plusBtn,#micBtn{width:36px;height:36px;border:none;background:none;font-size:22px;cursor:pointer;border-radius:50%;display:flex;align-items:center;justify-content:center}
#micBtn.listening{animation:pulse 1s infinite;background:#ff7a0022}
#input{flex:1;border:none;outline:none;font-size:16px;background:transparent;color:#111}
#sendBtn{width:44px;height:44px;background:#ff7a00;border:none;border-radius:50%;color:#fff;font-weight:800;cursor:pointer;display:flex;align-items:center;justify-content:center}
#counter{font-size:10px;background:#1e1e1e;border:1px solid #333;padding:5px 10px;border-radius:20px;color:#aaa}
#counter.low{background:#ff222211;border-color:#ff2222;color:#ff6666}
#counter.premium{background:#ff7a0022;border-color:#ff7a00;color:#ff7a00}
.speakBtn{margin-left:8px;padding:2px 8px;border-radius:12px;border:1px solid #333;background:#222;color:#ff7a00;font-size:11px;cursor:pointer}
#fileName{font-size:11px;color:#ff7a00;padding:0 0 8px 12px;display:none}
@keyframes pulse{0%{transform:scale(1)}50%{transform:scale(1.1)}100%{transform:scale(1)}}
/* ORBE SOLEIL DIEU V3 - IMAGE REELLE + DIVINE BREATH - 100% SAFE */
#voiceOverlay{display:none;position:fixed;top:0;left:0;right:0;bottom:0;background:#faf6f1;z-index:9999;flex-direction:column;align-items:center;padding:12px 16px;overflow:hidden}
#voiceOverlay.open{display:flex}
#orbWrap{position:relative;width:min(360px,84vw);height:min(360px,84vw);margin:auto;display:flex;align-items:center;justify-content:center;flex-shrink:0}
#orbGlow{position:absolute;inset:-20%;border-radius:50%;background:radial-gradient(circle, rgba(255,122,0,0.55) 0%, rgba(255,122,0,0.18) 45%, transparent 72%);filter:blur(14px);animation:glowPulse 2.2s ease-in-out infinite}
#orb{width:100%;height:100%;border-radius:50%;background-image:url('https://i.ibb.co/mVqcysZx/IMG-20261003-WA7652.jpg');background-size:115%;background-position:center;box-shadow:0 0 110px rgba(255,122,0,0.75), inset 0 0 35px rgba(255,255,255,0.6);position:relative;animation:adrynxLive 2.2s ease-in-out infinite;overflow:hidden}
#orb.clarity{filter:hue-rotate(190deg) saturate(1.4) brightness(1.15)}
#orb.energy{filter:hue-rotate(330deg) saturate(1.8) brightness(1.1)}
#orb.calm{filter:saturate(0.6) brightness(1.15) sepia(0.2);animation:adrynxLive 4.8s ease-in-out infinite!important}
#orb.speaking{animation:adrynxSpeak 0.5s ease-in-out infinite!important}
@keyframes adrynxLive{0%{transform:scale(1);filter:brightness(1) saturate(1)}50%{transform:scale(1.12);filter:brightness(1.25) saturate(1.15)}100%{transform:scale(1)}}
@keyframes adrynxSpeak{0%{transform:scale(1.06)}50%{transform:scale(1.28);filter:brightness(1.35)}100%{transform:scale(1.06)}}
@keyframes glowPulse{0%{transform:scale(0.85);opacity:0.6}50%{transform:scale(1.15);opacity:1}100%{transform:scale(0.85);opacity:0.6}}
@keyframes breathInOut{0%{transform:scale(1)}35%{transform:scale(1.25)}65%{transform:scale(1.25)}100%{transform:scale(1)}}
.breathing{animation:breathInOut 10s cubic-bezier(0.4,0,0.2,1) infinite!important}
#orbControls{display:flex;gap:8px;flex-wrap:wrap;justify-content:center;margin:6px 0}
.orbMode{padding:8px 14px;border-radius:20px;border:1px solid #ddd;background:#fff;color:#333;font-size:12px;cursor:pointer;font-weight:700}
.orbMode.active{background:#111;color:#fff;border-color:#111;transform:scale(1.05)}
#startBreath{padding:12px 22px;border-radius:28px;border:none;background:#ff8c2f;color:#fff;font-weight:900;font-size:14px;cursor:pointer;box-shadow:0 6px 20px rgba(255,122,0,0.35)}
#voiceClose{width:44px;height:44px;background:#111;border:none;border-radius:50%;color:#fff;font-size:20px;cursor:pointer}
</style>
</head><body>
<header><span>🔥 ADRYNX 1000F 🇨🇬</span><div style="display:flex;gap:6px;align-items:center"><span id="counter">25/25</span><button id="voiceToggle" class="on" style="padding:5px 10px;border-radius:20px;border:1px solid #ff7a00;background:#1e1e1e;color:#ff7a00;font-size:11px;font-weight:800;cursor:pointer">🔊</button></div></header>
<div id="modes"><button class="modeBtn active" data-mode="general">💬 Général</button><button class="modeBtn" data-mode="etudiant">🎓 Étudiant</button><button class="modeBtn" data-mode="vendeur">💰 Vendeur</button><button class="modeBtn" data-mode="codeur">💻 Codeur</button><button class="modeBtn" data-mode="image">🎨 Image 4K</button></div>
<div id="chat"></div>
<div id="bar"><div id="fileName"></div><div id="inputWrapper"><button id="plusBtn">+</button><input id="input" placeholder="Demander à ADRYNX..."><button id="micBtn">🎙️</button><button id="sendBtn">)))</button></div><input type="file" id="fileInput" hidden accept=".pdf,.docx,.doc,.txt,.csv,.xlsx,.xls,.png,.jpg,.jpeg,.webp"></div>
<div id="voiceOverlay"><div style="width:100%;display:flex;justify-content:space-between;align-items:center"><button onclick="closeOrb()" style="width:36px;height:36px;border-radius:50%;border:none;background:#fff">—</button><div style="background:#111;color:#ff7a00;padding:6px 12px;border-radius:20px;font-size:11px;font-weight:800">🔥 ORBE SOLEIL DIEU • ADRYNX 1000F</div><button style="width:36px;height:36px;border-radius:50%;border:none;background:#fff" onclick="closeOrb()">✕</button></div><div id="orbWrap"><div id="orbGlow"></div><div id="orb"></div></div><div style="width:100%;display:flex;flex-direction:column;gap:10px;align-items:center"><div style="font-weight:900;font-size:18px;color:#111;text-align:center">Breathing Session</div><div id="voiceStatus" style="font-size:13px;color:#666;font-weight:600">Breathe • 4s inhale • 6s exhale</div><button id="startBreath">⏸ Start Breathing</button><div id="orbControls"><button class="orbMode active" data-orb="divine">🔥 Divine</button><button class="orbMode" data-orb="calm">🍃 Calm • Focus</button><button class="orbMode" data-orb="clarity">☁️ Clarity</button><button class="orbMode" data-orb="energy">✨ Energy</button></div><div style="width:100%;max-width:500px;display:flex;align-items:center;background:#fff;border-radius:28px;border:1px solid #e5e7eb;padding:8px 10px;gap:8px"><button style="border:none;background:none;font-size:22px">+</button><input id="voiceInput" placeholder="Demander à ADRYNX..." style="flex:1;border:none;outline:none"><button id="voiceClose" onclick="closeOrb()" style="width:44px;height:44px;background:#111;border:none;border-radius:50%;color:#fff">✕</button></div></div></div>
<script>
const chat=document.getElementById('chat'), input=document.getElementById('input'), btn=document.getElementById('sendBtn'), voiceToggle=document.getElementById('voiceToggle'), counterEl=document.getElementById('counter'), plusBtn=document.getElementById('plusBtn'), fileInput=document.getElementById('fileInput'), micBtn=document.getElementById('micBtn'), fileNameEl=document.getElementById('fileName'), overlay=document.getElementById('voiceOverlay'), orb=document.getElementById('orb'), orbGlow=document.getElementById('orbGlow'), voiceStatus=document.getElementById('voiceStatus'), voiceInput=document.getElementById('voiceInput');
let history=[], currentMode='general', voiceEnabled=localStorage.getItem('adrynx_voice')!=='off', bestVoice=null, attachedFileContent=null, attachedFileName=null;
const LIMIT=25; let userId=localStorage.getItem('adrynx_uid'); if(!userId){ userId='user_'+Math.random().toString(36).substring(2,10); localStorage.setItem('adrynx_uid', userId); } if(window.location.search.includes('jonathan')) userId='jonathan_admin_unlimited'; const isAdmin = userId==='jonathan_admin_unlimited';
function getToday(){return new Date().toISOString().slice(0,10);} function loadCount(){ if(isAdmin) return {count:0,date:getToday()}; let d=JSON.parse(localStorage.getItem('adrynx_count_v2')||'{}'); if(d.date!==getToday()) return {count:0,date:getToday()}; return d; } function saveCount(c){localStorage.setItem('adrynx_count_v2', JSON.stringify({count:c,date:getToday()}));}
function updateCounter(){ if(isAdmin){ counterEl.innerText='∞ ILLIMITÉ'; counterEl.className='premium'; return; } let {count}=loadCount(); let rest=LIMIT-count; counterEl.innerText=rest>0?rest+'/25 restants':'0/25 - Premium?'; counterEl.className=rest<=5?'low':''; if(rest<=0){ input.placeholder='Limite atteinte - Passe Premium 1000F'; input.disabled=true; btn.disabled=true; btn.innerText='!'; btn.onclick=()=>location.href='/pay'; } } updateCounter();
function loadVoices(){const voices=speechSynthesis.getVoices(); if(!voices.length) return; const fr=voices.filter(v=>v.lang.toLowerCase().includes('fr')); const prio=['Google français','Amélie','Thomas','Hortense','Paul']; for(let n of prio){let f=fr.find(v=>v.name.includes(n)); if(f){bestVoice=f; break;}} if(!bestVoice&&fr.length) bestVoice=fr[0];}
if('speechSynthesis' in window){loadVoices(); speechSynthesis.onvoiceschanged=loadVoices;}
function updateVoiceBtn(){voiceToggle.innerText=voiceEnabled?'🔊':'🔇'; voiceToggle.className=voiceEnabled?'on':''; localStorage.setItem('adrynx_voice', voiceEnabled?'on':'off');}
updateVoiceBtn(); voiceToggle.onclick=()=>{voiceEnabled=!voiceEnabled; if(!voiceEnabled) speechSynthesis.cancel(); updateVoiceBtn();};
document.querySelectorAll('.modeBtn').forEach(b=>{b.onclick=()=>{document.querySelectorAll('.modeBtn').forEach(x=>x.classList.remove('active')); b.classList.add('active'); currentMode=b.dataset.mode; add('bot','✅ Mode <b>'+b.innerText+'</b> activé.');}});
function add(role, html){ let d=document.createElement('div'); d.className='msg '+role; if(role==='bot') d.innerHTML=html+' <button class="speakBtn" onclick="speakHuman(this.parentNode.innerText)">🔊</button>'; else d.innerHTML=html; chat.appendChild(d); chat.scrollTop=chat.scrollHeight; if(role==='bot') speakHuman(html); }
plusBtn.onclick=()=>fileInput.click();
fileInput.onchange=async (e)=>{ const file=e.target.files[0]; if(!file) return; fileNameEl.style.display='block'; fileNameEl.innerText='📎 '+file.name+' lecture...'; attachedFileName=file.name; try{ if(file.type.startsWith('text/')||file.name.match(/\.(csv|txt)$/i)){ attachedFileContent=await file.text(); } else if(file.name.match(/\.(png|jpg|jpeg|webp)$/i)){ const r=new FileReader(); attachedFileContent=await new Promise(res=>{r.onload=()=>res(r.result); r.readAsDataURL(file);}); } else { try{ attachedFileContent=await file.text(); if(attachedFileContent.length<20) throw 'bin'; }catch{ attachedFileContent='[FICHIER: '+file.name+']'; } } fileNameEl.innerText='✅ 📎 '+file.name+' prêt'; input.placeholder='Question sur '+file.name+'...'; }catch(err){ fileNameEl.innerText='⚠️ '+err; } };
function clearFile(){ attachedFileContent=null; attachedFileName=null; fileNameEl.style.display='none'; fileInput.value=''; input.placeholder='Demander à ADRYNX...'; }
let recognition=null; let keepListening=false;
if('webkitSpeechRecognition' in window || 'SpeechRecognition' in window){
  const SR=window.SpeechRecognition||window.webkitSpeechRecognition;
  recognition=new SR();
  recognition.lang='fr-FR';
  recognition.continuous=true;
  recognition.interimResults=false;
  recognition.onstart=()=>{ keepListening=true; micBtn.classList.add('listening'); orb.classList.add('listening'); voiceStatus.innerText='Je t\'écoute...'; };
  recognition.onend=()=>{ micBtn.classList.remove('listening'); orb.classList.remove('listening'); if(keepListening && overlay.classList.contains('open')){ try{recognition.start();}catch{} voiceStatus.innerText='Je t\'écoute encore...'; } else { voiceStatus.innerText='Breathe • 4s inhale • 6s exhale'; } };
  recognition.onresult=(ev)=>{ let t=ev.results[ev.results.length-1][0].transcript.trim(); if(!t) return; voiceStatus.innerText='Tu as dit: '+t; input.value=t; voiceInput.value=t; send(t); };
}
micBtn.onclick=()=>{ if(!recognition){ add('bot','🎤 Utilise Chrome'); return; } if(keepListening){ keepListening=false; try{recognition.stop();}catch{} } else { keepListening=true; try{recognition.start();}catch{ recognition.stop(); } } };
function openOrb(){ overlay.classList.add('open'); keepListening=true; if(recognition) try{recognition.start();}catch{} }
function closeOrb(){ keepListening=false; overlay.classList.remove('open'); speechSynthesis.cancel(); orb.classList.remove('speaking','breathing'); breathingActive=false; document.getElementById('startBreath').innerText='⏸ Start Breathing'; voiceStatus.innerText='Breathe • 4s inhale • 6s exhale'; try{recognition.stop();}catch{} }
function speakHuman(text){ if(!voiceEnabled) return; if(!('speechSynthesis' in window)) return; speechSynthesis.cancel(); let clean=text.replace(/<[^>]*>/g,'').replace(/https?:\/\/\S+/g,'').trim(); if(!clean) return; let phrases=clean.match(/[^.!?]+[.!?]+/g)||[clean]; let i=0; function speakNext(){ if(i>=phrases.length){ orb.classList.remove('speaking'); return; } const u=new SpeechSynthesisUtterance(phrases[i].slice(0,380)); if(bestVoice) u.voice=bestVoice; u.lang='fr-FR'; u.rate=0.93; u.pitch=1.02; orb.classList.add('speaking'); u.onend=()=>{ i++; speakNext(); }; speechSynthesis.speak(u); } speakNext(); }
let breathingActive=false, breathTimer=null;
document.querySelectorAll('.orbMode').forEach(b=>{b.onclick=()=>{document.querySelectorAll('.orbMode').forEach(x=>x.classList.remove('active')); b.classList.add('active'); orb.classList.remove('clarity','energy','calm'); if(b.dataset.orb!=='divine') orb.classList.add(b.dataset.orb); if(b.dataset.orb==='divine') voiceStatus.innerText='Mode Divine - Soleil Dieu'; if(b.dataset.orb==='calm') voiceStatus.innerText='Calm • Focus - Respire lentement'; if(b.dataset.orb==='clarity') voiceStatus.innerText='Clarity - Esprit clair bleu'; if(b.dataset.orb==='energy') voiceStatus.innerText='Energy - Pulse rouge puissant';}});
document.getElementById('startBreath').onclick=()=>{const btnB=document.getElementById('startBreath'); if(breathingActive){breathingActive=false; clearInterval(breathTimer); orb.classList.remove('breathing'); btnB.innerText='⏸ Start Breathing'; voiceStatus.innerText='Breathe • 4s inhale • 6s exhale'; speechSynthesis.cancel(); return;} breathingActive=true; btnB.innerText='⏹ Stop Breathing'; let inhale=true, cycles=0; orb.classList.add('breathing'); function tick(){if(!breathingActive) return; if(inhale){voiceStatus.innerText='🫁 INSPIRE 4s...'; try{speechSynthesis.speak(new SpeechSynthesisUtterance('Inspire'));}catch{}} else{voiceStatus.innerText='😮 EXPIRE 6s...'; try{speechSynthesis.speak(new SpeechSynthesisUtterance('Expire'));}catch{} cycles++; if(cycles>=6){breathingActive=false; clearInterval(breathTimer); orb.classList.remove('breathing'); btnB.innerText='⏸ Start Breathing'; voiceStatus.innerText='✅ Séance terminée - Bravo!'; return;}} inhale=!inhale;} tick(); breathTimer=setInterval(tick, 5000);};
async function send(forcedQ){ let q=(forcedQ||input.value||voiceInput.value).trim(); if(!q &&!attachedFileContent) return; if(!isAdmin){let {count}=loadCount(); if(count>=LIMIT){ add('bot','🔒 <b>Limite 25/jour atteinte</b><br>Passe Premium 1000F/semaine → <a href="/pay">PAYER MAINTENANT</a>'); return; }} let fullQ=q; if(attachedFileContent){ if(attachedFileContent.startsWith('data:image')) fullQ=(q||'Analyse image')+'\n[IMAGE: '+attachedFileName+']'; else fullQ=(q||'Analyse fichier')+'\n--- FICHIER '+attachedFileName+' ---\n'+attachedFileContent.slice(0,15000)+'\n--- FIN ---'; } add('user', (attachedFileName?'📎 <b>'+attachedFileName+'</b><br>':'')+ (q||'(analyse)')); history.push({role:'user', content:fullQ}); input.value=''; voiceInput.value=''; btn.disabled=true; let loading=document.createElement('div'); loading.className='msg bot'; loading.innerText='⚡ ADRYNX '+currentMode+' analyse...'; chat.appendChild(loading); chat.scrollTop=chat.scrollHeight; try{ let payload={message:fullQ,history:history.slice(-6),isPremium:isAdmin,mode:currentMode}; if(attachedFileContent && attachedFileContent.startsWith('data:image')) payload.image=attachedFileContent; let r=await fetch('/api/chat',{method:'POST',headers:{'Content-Type':'application/json','X-User-Id': userId},body:JSON.stringify(payload)}); let data=await r.json(); loading.remove(); if(data.limit_reached){ add('bot', data.reply); input.disabled=true; btn.disabled=true; btn.innerText='!'; btn.onclick=()=>location.href='/pay'; counterEl.innerText='0/25'; counterEl.className='low'; return; } add('bot', data.reply); history.push({role:'assistant', content:data.reply}); if(!isAdmin){let cur=loadCount(); cur.count=(cur.count||0)+1; saveCount(cur.count); updateCounter();} clearFile(); }catch(e){loading.remove(); add('bot','Erreur: '+e.message);} btn.disabled=false; input.focus(); }
btn.onclick=()=>{ let q=input.value.trim(); if(!q &&!attachedFileContent){ openOrb(); } else { send(); } };
input.onkeydown=e=>{if(e.key==='Enter') send();};
voiceInput.onkeydown=e=>{if(e.key==='Enter') send();};
add('bot','Salut 👋 Je suis <b>ADRYNX Phoenix Prime</b> - Soleil Dieu V3<br>Image réelle + Divine Breath + Calm/Clarity/Energy<br>🟠 ))) vide = ORBE SOLEIL DIEU qui vit');
</script>
</body></html>
