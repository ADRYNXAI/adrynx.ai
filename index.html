<!DOCTYPE html><html lang="fr"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ADRYNX Phoenix Prime - Orbe Vivante V2</title>
<style>
body{background:#0a0a0a;color:#fff;font-family:Inter,sans-serif;margin:0;padding:0;display:flex;flex-direction:column;height:100vh}
header{padding:10px 12px;border-bottom:1px solid #222;background:#111;font-weight:900;color:orange;display:flex;justify-content:space-between;align-items:center}
#modes{display:flex;gap:6px;padding:10px;background:#111;border-bottom:1px solid #222;overflow-x:auto;scrollbar-width:none}
.modeBtn{padding:8px 14px;border-radius:20px;border:1px solid #333;background:#1e1e1e;color:#fff;font-size:12px;cursor:pointer;white-space:nowrap}
.modeBtn.active{background:#ff7a00;border-color:#ff7a00;font-weight:800}
#chat{flex:1;overflow:auto;padding:15px;display:flex;flex-direction:column;gap:12px}
.msg{padding:12px 15px;border-radius:14px;max-width:92%;line-height:1.4}
.user{align-self:flex-end;background:#ff7a00;color:#fff}
.bot{align-self:flex-start;background:#1e1e1e;border:1px solid #2a2a2a}
#bar{display:flex;flex-direction:column;background:#111;border-top:1px solid #222;padding:12px}
#inputWrapper{flex:1;display:flex;align-items:center;background:#fff;border-radius:28px;padding:6px 8px 6px 12px;gap:8px}
#plusBtn,#micBtn{width:36px;height:36px;border:none;background:none;font-size:22px;cursor:pointer}
#input{flex:1;border:none;outline:none;font-size:16px;background:transparent;color:#111}
#sendBtn{width:44px;height:44px;background:#ff7a00;border:none;border-radius:50%;color:#fff;font-weight:800;cursor:pointer}
#counter{font-size:10px;background:#1e1e1e;border:1px solid #333;padding:5px 10px;border-radius:20px;color:#aaa}
.speakBtn{margin-left:8px;padding:2px 8px;border-radius:12px;border:1px solid #333;background:#222;color:#ff7a00;font-size:11px;cursor:pointer}
#fileName{font-size:11px;color:#ff7a00;padding:0 0 8px 12px;display:none}
#voiceOverlay{display:none;position:fixed;top:0;left:0;right:0;bottom:0;background:#fdf6ec;z-index:9999;flex-direction:column;align-items:center;padding:12px 16px;overflow:hidden}
#voiceOverlay.open{display:flex}
#orbWrap{position:relative;width:min(380px,86vw);height:min(380px,86vw);margin:auto;display:flex;align-items:center;justify-content:center;flex-shrink:0}
#orbGlow{position:absolute;inset:-18%;border-radius:50%;background:radial-gradient(circle, rgba(255,122,0,0.45) 0%, rgba(255,122,0,0.12) 45%, transparent 72%);filter:blur(12px);animation:glowPulse 2.2s ease-in-out infinite;pointer-events:none}
#orb{width:100%;height:100%;border-radius:50%;overflow:hidden;position:relative;background:#000;box-shadow:0 0 40px rgba(255,122,0,0.5), inset 0 0 30px rgba(255,255,255,0.25);animation:divineBreath 3.2s ease-in-out infinite}
#orbVideo{width:100%;height:100%;object-fit:cover;border-radius:50%;display:block;transform:scale(1.28);will-change:transform}
#orb.speaking{animation:divineSpeak 0.45s ease-in-out infinite!important}
@keyframes divineBreath{0%{transform:scale(1)}50%{transform:scale(1.08);filter:brightness(1.12)}100%{transform:scale(1)}}
@keyframes divineSpeak{0%{transform:scale(1.04)}50%{transform:scale(1.18)}100%{transform:scale(1.04)}}
@keyframes breathInOut{0%{transform:scale(1)}35%{transform:scale(1.22)}65%{transform:scale(1.22)}100%{transform:scale(1)}}
@keyframes glowPulse{0%{transform:scale(0.92);opacity:0.7}50%{transform:scale(1.08);opacity:1}100%{transform:scale(0.92);opacity:0.7}}
.breathing{animation:breathInOut 10s cubic-bezier(0.4,0,0.2,1) infinite!important}
#orbControls{display:flex;gap:8px;flex-wrap:wrap;justify-content:center;margin:8px 0}
.orbMode{padding:9px 16px;border-radius:22px;border:1.5px solid #e5d5b8;background:#fff;color:#111;font-size:13px;cursor:pointer;font-weight:600;transition:0.2s}
.orbMode.active{background:#111;color:#fff;border-color:#111;transform:scale(1.05);box-shadow:0 4px 14px rgba(0,0,0,0.2)}
#startBreath{padding:13px 26px;border-radius:28px;border:none;background:#ff8c2f;color:#fff;font-weight:900;font-size:14px;cursor:pointer;box-shadow:0 6px 20px rgba(255,122,0,0.35)}
</style>
</head><body>
<header><span>🔥 ADRYNX 1000F 🇨🇬</span><span id="counter">25/25</span></header>
<div id="modes"><button class="modeBtn active" data-mode="general">💬 Général</button><button class="modeBtn" data-mode="etudiant">🎓 Étudiant</button><button class="modeBtn" data-mode="vendeur">💰 Vendeur</button><button class="modeBtn" data-mode="codeur">💻 Codeur</button><button class="modeBtn" data-mode="image">🎨 Image 4K</button></div>
<div id="chat"></div>
<div id="bar"><div id="fileName"></div><div id="inputWrapper"><button id="plusBtn">+</button><input id="input" placeholder="Demander à ADRYNX..."><button id="micBtn">🎙️</button><button id="sendBtn">)))</button></div><input type="file" id="fileInput" hidden></div>
<div id="voiceOverlay"><div style="width:100%;display:flex;justify-content:space-between"><button onclick="closeOrb()" style="width:36px;height:36px;border-radius:50%;border:none;background:#fff">—</button><div style="background:#111;color:#ff7a00;padding:6px 12px;border-radius:20px;font-size:11px;font-weight:800">🔥 ORBE VIVANTE V2</div><button onclick="closeOrb()" style="width:36px;height:36px;border-radius:50%;border:none;background:#fff">✕</button></div>
<div id="orbWrap"><div id="orbGlow"></div><div id="orb"><video id="orbVideo" autoplay loop muted playsinline preload="auto"><source src="https://files.catbox.moe/nqsplc.mp4" type="video/mp4"></video></div></div>
<div style="display:flex;flex-direction:column;gap:10px;align-items:center;width:100%">
<div style="font-weight:900;font-size:19px;color:#111">Breathing Session</div><div id="voiceStatus" style="font-size:14px;color:#666;font-weight:700">Breathe • 4s inhale • 6s exhale</div>
<button id="startBreath">⏸ Start Breathing</button>
<div id="orbControls"><button class="orbMode active" data-orb="divine">🔥 Vivante</button><button class="orbMode" data-orb="calm">🍃 Calm • Focus</button><button class="orbMode" data-orb="clarity">☁️ Clarity</button><button class="orbMode" data-orb="energy">✨ Energy</button></div>
<div style="width:100%;max-width:500px;display:flex;align-items:center;background:#fff;border-radius:28px;border:1px solid #e5e7eb;padding:8px 10px;gap:8px"><input id="voiceInput" placeholder="Demander à ADRYNX..." style="flex:1;border:none;outline:none"><button onclick="closeOrb()" style="width:36px;height:36px;border-radius:50%;border:none;background:#111;color:#fff">✕</button></div>
</div></div>
<script>
const chat=document.getElementById('chat'), input=document.getElementById('input'), btn=document.getElementById('sendBtn'), counterEl=document.getElementById('counter'), plusBtn=document.getElementById('plusBtn'), fileInput=document.getElementById('fileInput'), micBtn=document.getElementById('micBtn'), fileNameEl=document.getElementById('fileName'), overlay=document.getElementById('voiceOverlay'), orb=document.getElementById('orb'), orbGlow=document.getElementById('orbGlow'), orbVideo=document.getElementById('orbVideo'), voiceStatus=document.getElementById('voiceStatus'), voiceInput=document.getElementById('voiceInput');
let history=[], currentMode='general'; const LIMIT=25; let userId=localStorage.getItem('adrynx_uid')||'user_'+Math.random().toString(36).substr(2,8); localStorage.setItem('adrynx_uid',userId);
function getToday(){return new Date().toISOString().slice(0,10)} function loadCount(){let d=JSON.parse(localStorage.getItem('adrynx_count_v2')||'{}'); if(d.date!==getToday()) return {count:0}; return d} function saveCount(c){localStorage.setItem('adrynx_count_v2',JSON.stringify({count:c,date:getToday()}))} function updateCounter(){let {count}=loadCount(); let rest=LIMIT-count; counterEl.innerText=rest>0?rest+'/25':'0/25'} updateCounter();
document.querySelectorAll('.modeBtn').forEach(b=>{b.onclick=()=>{document.querySelectorAll('.modeBtn').forEach(x=>x.classList.remove('active')); b.classList.add('active'); currentMode=b.dataset.mode; add('bot','Mode '+b.innerText+' activé');}});
function add(r,h){let d=document.createElement('div'); d.className='msg '+r; d.innerHTML=h; chat.appendChild(d); chat.scrollTop=chat.scrollHeight}
plusBtn.onclick=()=>fileInput.click();
let recognition=null, keep=false; if('webkitSpeechRecognition' in window || 'SpeechRecognition' in window){const SR=window.SpeechRecognition||window.webkitSpeechRecognition; recognition=new SR(); recognition.lang='fr-FR'; recognition.continuous=true; recognition.onresult=e=>{let t=e.results[e.results.length-1][0].transcript.trim(); input.value=t; voiceInput.value=t; send(t);}; recognition.onend=()=>{if(keep&&overlay.classList.contains('open')){try{recognition.start()}catch{}}}}
micBtn.onclick=()=>{if(!recognition){add('bot','Chrome requis'); return;} if(keep){keep=false; recognition.stop()} else {keep=true; recognition.start()}};
function openOrb(){overlay.classList.add('open'); keep=true; if(recognition) try{recognition.start()}catch{} if(orbVideo) orbVideo.play()}
function closeOrb(){keep=false; overlay.classList.remove('open'); orb.classList.remove('speaking','breathing'); if(orbVideo) orbVideo.classList.remove('speaking','breathing'); if(orbGlow) orbGlow.style.animation='glowPulse 2.2s ease-in-out infinite'; if(recognition) try{recognition.stop()}catch{}; document.getElementById('startBreath').innerText='⏸ Start Breathing'; voiceStatus.innerText='Breathe • 4s inhale • 6s exhale'}
let breathing=false, timer=null;
document.querySelectorAll('.orbMode').forEach(b=>{b.onclick=()=>{document.querySelectorAll('.orbMode').forEach(x=>x.classList.remove('active')); b.classList.add('active'); if(b.dataset.orb==='clarity') orbVideo.style.filter='hue-rotate(185deg) saturate(1.3) brightness(1.15)'; else if(b.dataset.orb==='energy') orbVideo.style.filter='hue-rotate(335deg) saturate(1.9) brightness(1.05)'; else if(b.dataset.orb==='calm') orbVideo.style.filter='saturate(0.65) brightness(1.15) sepia(0.25)'; else orbVideo.style.filter='none';}});
document.getElementById('startBreath').onclick=()=>{const bb=document.getElementById('startBreath'); if(breathing){breathing=false; clearInterval(timer); orb.classList.remove('breathing'); orbVideo.classList.remove('breathing'); bb.innerText='⏸ Start Breathing'; voiceStatus.innerText='Breathe • 4s inhale • 6s exhale'; return;} breathing=true; bb.innerText='⏹ Stop Breathing'; let inh=true, cyc=0; orb.classList.add('breathing'); orbVideo.classList.add('breathing'); function tick(){if(!breathing) return; if(inh){voiceStatus.innerText='🫁 INSPIRE 4s...'} else {voiceStatus.innerText='😮 EXPIRE 6s...'; cyc++; if(cyc>=6){breathing=false; clearInterval(timer); orb.classList.remove('breathing'); orbVideo.classList.remove('breathing'); bb.innerText='⏸ Start Breathing'; voiceStatus.innerText='✅ Bravo!'; return;}} inh=!inh;} tick(); timer=setInterval(tick,5000);};
async function send(q0){let q=(q0||input.value||voiceInput.value).trim(); if(!q) return; let {count}=loadCount(); if(count>=LIMIT){add('bot','Limite 25/j'); return;} add('user',q); history.push({role:'user',content:q}); input.value=''; voiceInput.value=''; let ld=document.createElement('div'); ld.className='msg bot'; ld.innerText='⚡ ADRYNX analyse...'; chat.appendChild(ld); try{let r=await fetch('/api/chat',{method:'POST',headers:{'Content-Type':'application/json','X-User-Id':userId},body:JSON.stringify({message:q,history:history.slice(-6),mode:currentMode})}); let d=await r.json(); ld.remove(); add('bot',d.reply); saveCount((count||0)+1); updateCounter();}catch(e){ld.remove(); add('bot','Erreur '+e.message)}}
btn.onclick=()=>{let q=input.value.trim(); if(!q){openOrb()} else {send()}}; input.onkeydown=e=>{if(e.key==='Enter') send()}; voiceInput.onkeydown=e=>{if(e.key==='Enter') send()};
add('bot','ADRYNX V2 Vivante prête. ))) = orbe');
</script>
</body></html>
