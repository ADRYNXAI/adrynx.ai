<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>ADRYNX Phoenix</title>

<link rel="stylesheet" href="/style.css">

<style>
body {
    margin: 0;
    background: #05050A;
    color: #ffffff;
    font-family: Arial, sans-serif;
    display: flex;
    min-height: 100vh;
}

.sidebar {
    width: 300px;
    background: #111111;
    padding: 20px;
    border-right: 1px solid #222222;
    box-sizing: border-box;
}

.main {
    flex: 1;
    padding: 20px;
    box-sizing: border-box;
}

.card {
    background: #1a1a1a;
    border-radius: 12px;
    padding: 12px;
    margin-bottom: 10px;
}

video {
    width: 100%;
    border-radius: 12px;
    display: block;
}

.btn {
    background: #00ff88;
    color: #000000;
    padding: 12px;
    width: 100%;
    border: 0;
    border-radius: 8px;
    font-weight: 800;
    cursor: pointer;
}

.btn:hover {
    opacity: 0.9;
}

#chat {
    min-height: 300px;
    max-height: 60vh;
    overflow-y: auto;
    padding: 5px;
}

.message {
    padding: 10px;
    margin: 8px 0;
    border-radius: 8px;
    line-height: 1.5;
}

.user {
    background: #222222;
}

.assistant {
    background: #101b16;
}

.error {
    background: #351515;
    color: #ff8f8f;
}

.input-area {
    display: flex;
    gap: 8px;
    margin-top: 12px;
}

#q {
    flex: 1;
    padding: 10px;
    background: #111111;
    border: 1px solid #333333;
    color: #ffffff;
    border-radius: 6px;
    box-sizing: border-box;
}

.send {
    padding: 10px 18px;
    cursor: pointer;
}

#status {
    margin-top: 10px;
    font-size: 13px;
    color: #aaaaaa;
}

#log {
    white-space: pre-wrap;
}
</style>

</head>

<body>

<div class="sidebar">

<h2>ADRYNX.</h2>

<div class="card" style="padding: 0; overflow: hidden;">

<video
src="https://files.catbox.moe/y2nvi4.mp4"
autoplay
muted
loop
playsinline>
</video>

<div style="padding: 10px;">
🔥 PHOENIX LIVE
</div>

</div>

<button class="btn" onclick="ask('Cc')">
TEST CC
</button>

</div>


<div class="main">

<h1>ADRYNX v7.0</h1>

<div class="card">

<div id="chat"></div>

<div class="input-area">

<input
id="q"
autocomplete="off"
placeholder="Écris un message à ADRYNX..."
>

<button class="send" onclick="send()">
Envoyer
</button>

</div>

<div id="status">
État : prêt
</div>

</div>

<pre id="log">> Ready</pre>

</div>


<script>

/*
 * Identifiant de conversation.
 *
 * Il est conservé pendant la session
 * et transmis au backend ADRYNX.
 */

let conversationId = null;


function escapeHtml(value) {

    return String(value)
        .replaceAll("&", "&amp;")
        .replaceAll("<", "&lt;")
        .replaceAll(">", "&gt;")
        .replaceAll('"', "&quot;")
        .replaceAll("'", "&#039;");

}


function addMessage(role, text, type = "") {

    const chat = document.getElementById("chat");

    const div = document.createElement("div");

    div.className =
        "message " +
        role +
        " " +
        type;

    const label =
        role === "user"
            ? "Toi"
            : "ADRYNX";

    div.innerHTML =
        "<b>" +
        label +
        ":</b> " +
        escapeHtml(text);

    chat.appendChild(div);

    chat.scrollTop = chat.scrollHeight;

}


async function send() {

    const input =
        document.getElementById("q");

    const q =
        input.value.trim();

    if (!q) {
        return;
    }

    await ask(q);

}


async function ask(q) {

    q =
        String(q || "").trim();

    if (!q) {
        return;
    }

    const input =
        document.getElementById("q");

    const status =
        document.getElementById("status");

    const log =
        document.getElementById("log");


    addMessage(
        "user",
        q
    );


    input.value = "";


    status.textContent =
        "État : ADRYNX réfléchit...";


    try {

        const response =
            await fetch(
                "/api/ask",
                {
                    method: "POST",

                    headers: {
                        "Content-Type":
                            "application/json"
                    },

                    body: JSON.stringify({

                        message: q,

                        telephone:
                            "jonathan",

                        conversation_id:
                            conversationId

                    })
                }
            );


        let data = null;


        try {

            data =
                await response.json();

        } catch (jsonError) {

            throw new Error(
                "L'API a envoyé une réponse qui n'est pas du JSON."
            );

        }


        /*
         * Une erreur HTTP ne doit jamais
         * être transformée en fausse réponse.
         */

        if (!response.ok) {

            const detail =
                data?.detail ||
                data?.error ||
                "Erreur HTTP " +
                response.status;

            throw new Error(detail);

        }


        /*
         * Le backend doit confirmer
         * que la requête a réussi.
         */

        if (data.ok !== true) {

            throw new Error(
                data.error ||
                data.detail ||
                "ADRYNX a signalé une erreur."
            );

        }


        /*
         * adrynx.py renvoie :
         *
         * "answer": "..."
         *
         * et non :
         *
         * "reponse": "..."
         */

        if (
            typeof data.answer !== "string" ||
            !data.answer.trim()
        ) {

            throw new Error(
                "ADRYNX n'a fourni aucune réponse."
            );

        }


        /*
         * Conservation de l'identifiant
         * réel de conversation.
         */

        if (data.conversation_id) {

            conversationId =
                data.conversation_id;

        }


        /*
         * Affichage de la véritable
         * réponse produite par ADRYNX.
         */

        addMessage(
            "assistant",
            data.answer
        );


        status.textContent =
            "État : ADRYNX en ligne";


        log.textContent =
            "> Réponse reçue\n" +
            "> Source : " +
            (data.source || "backend") +
            "\n" +
            "> Intent : " +
            (data.intent || "non défini") +
            "\n" +
            "> Conversation : " +
            (conversationId || "non définie");

    } catch (error) {

        /*
         * Aucune réponse inventée.
         *
         * Si le backend rencontre
         * réellement une erreur,
         * elle est affichée.
         */

        addMessage(
            "assistant",
            "Erreur ADRYNX : " +
            error.message,
            "error"
        );


        status.textContent =
            "État : ERREUR";


        log.textContent =
            "> Erreur\n" +
            "> " +
            error.message;


        console.error(
            "ADRYNX ERROR:",
            error
        );

    }

}


/*
 * Entrée clavier :
 * Entrée = envoyer.
 */

document
    .getElementById("q")
    .addEventListener(
        "keydown",
        function(event) {

            if (
                event.key === "Enter" &&
                !event.shiftKey
            ) {

                event.preventDefault();

                send();

            }

        }
    );

</script>

</body>
</html>
