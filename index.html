<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>ADRYNX Phoenix Prime</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#0f0f0f">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0;font-family:'Inter',system-ui}
body{background:#0a0a0a;color:#fff;height:100vh;display:flex;overflow:hidden}
.sidebar{width:280px;background:#111113;border-right:1px solid #222;display:flex;flex-direction:column;padding:16px;gap:16px}
.logo{display:flex;align-items:center;gap:10px;font-weight:800;font-size:22px}
.logo span{background:linear-gradient(90deg,#ff7a00,#ff3c00);-webkit-background-clip:text;-webkit-text-fill-color:transparent}
.logo small{display:block;font-size:10px;letter-spacing:3px;color:#666;font-weight:400}
.newChat{background:linear-gradient(90deg,#ff7a00,#ff3c00);border:none;color:#fff;padding:12px;border-radius:24px;font-weight:700;cursor:pointer}
.newChat:active{transform:scale(0.98)}
.recents{flex:1;overflow-y:auto}
.recents h4{font-size:11px;color:#666;letter-spacing:2px;margin:16px 0 8px}
.chat-item{padding:10px 12px;border-radius:10px;color:#888;cursor:pointer;display:flex;gap:8px;align-items:center;font-size:14px}
.chat-item.active{background:#1e1e1e;color:#fff}
.userBox{border-top:1px solid #222;padding-top:12px;display:flex;align-items:center;gap:10px}
.avatar{width:36px;height:36px;border-radius:50%;background:linear-gradient(90deg,#ff7a00,#ff3c00);display:flex;align-items:center;justify-content:center;font-weight:800}
.main{flex:1;display:flex;flex-direction:column;background:#0f0f0f;min-width:0}
.topbar{padding:14px 16px;border-bottom:1px solid #1e1e1e;display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:nowrap;overflow:hidden}
.topbar b{white-space:nowrap;font-size:14px}
.status{color:#00ff88;font-size:11px;white-space:nowrap}
#chat{flex:1;overflow-y:auto;padding:16px;display:flex;flex-direction:column;gap:18px}
.msg{max-width:78%;padding:14px 16px;border-radius:18px;line-height:1.6;white-space:pre-wrap;word-wrap:break-word}
.user{align-self:flex-end;background:linear-gradient(90deg,#ff7a00,#ff3c00);color:#fff;border-bottom-right-radius:6px}
.ai{align-self:flex-start;background:#1c1c1f;border:1px solid #2a2a2e;border-bottom-left-radius:6px}
.ai img{max-width:100%;border-radius:12px;margin-top:10px;border:1px solid #333}
.inputArea{padding:12px;background:#111113;border-top:1px solid #1e1e1e}
.inputBox{display:flex;align-items:center;gap:8px;background:#1e1e1e;border:1px solid #ff7a0033;border-radius:28px;padding:6px 10px}
.inputBox input{flex:1;background:transparent;border:none;color:#fff;outline:none;padding:8px;font-size:15px;min-width:0}
.iconBtn{background:transparent;border:none;color:#888;font-size:18px;cursor:pointer;flex-shrink:0}
.sendBtn{width:42px;height:42px;flex-shrink:0;border-radius:50%;background:linear-gradient(90deg,#ff7a00,#ff3c00);border:none;color:#fff;font-size:18px;cursor:pointer}
.premium-badge{background:gold;color:#000;padding:2px 6px;border-radius:10px;font-size:9px;font-weight:800;white-space:nowrap;flex-shrink:0}
.previewImg{max-width:120px;border-radius:10px;margin-bottom:8px;display:none;border:1px solid #ff7a00}

/* FIX MOBILE ADRYNX - intégré */
@media(max-width:800px){
  .sidebar{display:none}
  .msg{max-width:92%}
  .topbar{padding:10px 12px}
  .topbar b{font-size:13px}
  .status{font-size:10px}
  #chat{padding:12px}
  .inputArea{padding:10px}
}
@media(max-width:400px){
  .topbar b{font-size:12px}
  .premium-badge{font-size:8px;padding:2px 5px}
}
</style>
</head>
<body>
<div class="sidebar">
  <div class="logo">🔥 <div><span>ADRYNX</span><small>PHOENIX PRIME</small></div></div>
  <button class="newChat" onclick="newChat()">+ New Chat</button>
  <div class="recents">
    <h4>RÉCENTS</h4>
    <div class="chat-item active" id="recent0">💬 Nouvelle discussion</div>
  </div>
  <div class="userBox">
    <div class="avatar">JO</div>
    <div><div style="font-size:13px;font-weight:600">Jonathan Obenda</div><div style="font-size:11px;color:#666" id="planText">Plan Gratuit</div></div>
  </div>
</div>

<div class="main">
  <div class="topbar">
    <div style="display:flex;align-items:center;gap:6px;min-width:0;overflow:hidden"><span style="font-size:18px;flex-shrink:0">🔥</span><b>Phoenix Prime AI</b> <span class="status">● Online</span> <span class="premium-badge" id="premiumBadge">GRATUIT</span></div>
    <a href="/" style="color:#666;text-decoration:none;flex-shrink:0">🏠</a>
  </div>
  <div id="chat"></div>
  <div class="inputArea">
    <img id="preview" class="previewImg"/>
    <div class="inputBox">
      <button class="iconBtn" onclick="triggerFile()" title="Envoyer cours">📎</button>
      <input id="input" placeholder="Parle à ADRYNX...">
      <button class="iconBtn" onclick="startVoice()" title="Vocal">🎤</button>
      <button class="sendBtn" id="sendBtn" onclick="send()">➤</button>
    </div>
    <div style="font-size:10px;color:#555;margin-top:6px;text-align:center">3 messages gratuits puis Premium 1000F • Créé par Jonathan Obenda</div>
  </div>
</div>
<input type="file" id="fileInput" hidden accept="image/*,.pdf">
<script src="app.js"></script>
<script>if('serviceWorker' in navigator){navigator.serviceWorker.register('sw.js')}</script>
</body>
</html>
