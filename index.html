<!DOCTYPE html>
<html lang="fr"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>ADRYNX - Command Center Phoenix</title>
<style>
:root{--violet:#7B5CFF;--green:#00FF88;--bg:#05050A}
body{margin:0;background:var(--bg);color:#fff;font-family:Inter,sans-serif;display:flex;height:100vh}
.sidebar{width:300px;background:rgba(255,255,255,0.03);border-right:1px solid #1a1a1a;padding:20px;display:flex;flex-direction:column}
.main{flex:1;padding:24px;overflow:auto}
.card{background:rgba(255,255,255,0.05);border:1px solid #222;border-radius:16px;padding:16px;margin-bottom:12px}
video{width:100%;border-radius:12px;display:block}
.btn{background:var(--green);color:#000;padding:16px;border-radius:12px;font-weight:800;border:0;width:100%;cursor:pointer;box-shadow:0 0 30px #00FF8855}
.pulse{width:8px;height:8px;background:var(--green);border-radius:50%;display:inline-block;animation:pulse 1s infinite}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.3}}
</style></head><body>
<div class="sidebar">
<h2>ADRYNX<span style="color:var(--violet)">.</span></h2>
<small style="opacity:.5">PHOENIX v6.2</small>
<div class="card" style="padding:0;overflow:hidden;box-shadow:0 0 40px #7B5CFF44">
<video src="https://files.catbox.moe/y2nvi4.mp4" autoplay muted loop playsinline></video>
<div style="padding:12px"><span class="pulse"></span> PHÉNIX VIDEO CORE LIVE</div>
</div>
<div class="card">CRISTAL ENGINE<br><span style="color:var(--green)">98.2% ON - PARENT UNIQUE</span></div>
<button class="btn" onclick="document.getElementById('q').value='Activer paiement 5000 FCFA';ask()">ACTIVER PAIEMENT 5000 FCFA</button>
</div>
<div class="main">
<h1>ADRYNX v6</h1><p>Plus que l'impossible — Brazzaville</p>
<div class="card"><div id="chat" style="min-height:200px"></div>
<input id="q" placeholder="Teste Cc ici..." style="width:75%;padding:12px;background:#111;border:1px solid #333;color:#fff;border-radius:8px">
<button onclick="ask()" style="padding:12px;border-radius:8px">Envoyer</button></div>
<pre id="log" style="opacity:.5">> System ready
> Video: y2nvi4.mp4 LOCKED
> Parents: 1 unique [FIXED]</pre>
</div>
<script>
async function ask(){
 let q=document.getElementById('q').value; if(!q) return;
 document.getElementById('chat').innerHTML+=`<p><b>Toi:</b> ${q}</p>`;
 let r=await fetch('/api/ask',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({q, telephone:'jonathan'})});
 let d=await r.json();
 document.getElementById('chat').innerHTML+=`<p><b>ADRYNX:</b> ${d.reponse||d.data?.reponse}</p>`;
 document.getElementById('log').innerText+=`\n> ${q} => ${d.intent||'ok'} (${d.source||'parent'})`;
 document.getElementById('q').value='';
}
</script></body></html>
