<!DOCTYPE html>
<html lang="fr"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ADRYNX TEST</title></head><body style="background:#0a0a0a;color:#fff;padding:20px;font-family:sans-serif">
<div id="chat" style="height:80vh;overflow:auto;border:1px solid #333;padding:10px;margin-bottom:10px"></div>
<div style="display:flex;gap:10px"><input id="input" style="flex:1;padding:12px;border-radius:20px;border:none;background:#222;color:#fff" placeholder="tape ici"><button id="sendBtn" style="padding:12px 20px;background:orange;border:none;border-radius:20px;color:#fff;font-weight:800">ENVOYER</button></div>
<script>
console.log("TEST JS CHARGE");
const chat=document.getElementById('chat');
const input=document.getElementById('input');
const btn=document.getElementById('sendBtn');

function add(t){let d=document.createElement('div');d.style.margin='10px 0';d.style.padding='10px';d.style.background='#1e1e1e';d.style.borderRadius='10px';d.innerHTML=t;chat.appendChild(d);chat.scrollTop=99999;}

async function send(){
  const q=input.value.trim();
  alert("CLICK DETECTE: "+q); // TEST
  if(!q) return;
  add("<b>Toi:</b> "+q);
  input.value='';
  add("⚡ ADRYNX charge...");
  try{
    let r=await fetch('/api/chat',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({message:q,history:[],isPremium:false})});
    let data=await r.json();
    add("<b>ADRYNX:</b> "+data.reply);
  }catch(e){
    add("Erreur: "+e);
  }
}
btn.onclick=send;
input.onkeydown=e=>{if(e.key==='Enter')send()};
add("Si tu vois ça, le JS marche. Tape quelque chose et clique ENVOYER.");
</script>
</body></html>
