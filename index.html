<!DOCTYPE html>
<html lang="fr">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <meta
        name="theme-color"
        content="#ffffff"
    >

    <title>ADRYNX</title>

    <style>

        * {
            box-sizing: border-box;
        }

        html,
        body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            font-family:
                Inter,
                system-ui,
                -apple-system,
                BlinkMacSystemFont,
                "Segoe UI",
                sans-serif;
            background: #ffffff;
            color: #111111;
        }

        body {
            overflow: hidden;
        }

        .app {
            width: 100%;
            height: 100vh;
            display: flex;
            flex-direction: column;
            background: #ffffff;
        }

        /* ==================================================
           HEADER
           ================================================== */

        .header {
            height: 64px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 18px;
            border-bottom: 1px solid #eeeeee;
            background: #ffffff;
            flex-shrink: 0;
        }

        .brand {
            display: flex;
            align-items: center;
            gap: 10px;
            font-weight: 800;
            font-size: 20px;
            letter-spacing: -0.5px;
        }

        .logo {
            width: 34px;
            height: 34px;
            border-radius: 10px;
            background: #111111;
            color: #ffffff;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 15px;
            font-weight: 800;
        }

        .status {
            display: flex;
            align-items: center;
            gap: 7px;
            font-size: 12px;
            color: #777777;
        }

        .status-dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: #22c55e;
        }

        /* ==================================================
           CHAT
           ================================================== */

        .chat {
            flex: 1;
            overflow-y: auto;
            padding: 24px 16px 120px;
        }

        .chat-inner {
            width: 100%;
            max-width: 850px;
            margin: 0 auto;
        }

        .welcome {
            min-height: 65vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-align: center;
            padding: 20px;
        }

        .welcome-logo {
            width: 68px;
            height: 68px;
            border-radius: 20px;
            background: #111111;
            color: #ffffff;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 24px;
            font-weight: 900;
            margin-bottom: 20px;
        }

        .welcome h1 {
            margin: 0 0 10px;
            font-size: 34px;
            letter-spacing: -1.5px;
        }

        .welcome p {
            margin: 0;
            color: #777777;
            font-size: 15px;
            max-width: 500px;
            line-height: 1.6;
        }

        .message {
            display: flex;
            margin: 20px 0;
        }

        .message.user {
            justify-content: flex-end;
        }

        .message.ai {
            justify-content: flex-start;
        }

        .bubble {
            max-width: 82%;
            padding: 13px 16px;
            border-radius: 18px;
            line-height: 1.55;
            font-size: 15px;
            white-space: pre-wrap;
            overflow-wrap: anywhere;
        }

        .user .bubble {
            background: #111111;
            color: #ffffff;
            border-bottom-right-radius: 5px;
        }

        .ai .bubble {
            background: #f3f3f3;
            color: #111111;
            border-bottom-left-radius: 5px;
        }

        .loading {
            display: inline-flex;
            gap: 5px;
            padding: 14px 17px;
            background: #f3f3f3;
            border-radius: 18px;
        }

        .loading span {
            width: 6px;
            height: 6px;
            border-radius: 50%;
            background: #888888;
            animation: pulse 1s infinite;
        }

        .loading span:nth-child(2) {
            animation-delay: .15s;
        }

        .loading span:nth-child(3) {
            animation-delay: .30s;
        }

        @keyframes pulse {

            0%,
            100% {
                opacity: .25;
            }

            50% {
                opacity: 1;
            }
        }

        /* ==================================================
           INPUT
           ================================================== */

        .composer-area {
            position: fixed;
            left: 0;
            right: 0;
            bottom: 0;
            padding: 12px 14px 16px;
            background: linear-gradient(
                to top,
                #ffffff 75%,
                rgba(255,255,255,0)
            );
        }

        .composer {
            width: 100%;
            max-width: 850px;
            margin: 0 auto;
            display: flex;
            align-items: flex-end;
            gap: 9px;
            padding: 8px;
            border: 1px solid #dddddd;
            border-radius: 18px;
            background: #ffffff;
            box-shadow:
                0 5px 25px rgba(0,0,0,.07);
        }

        textarea {
            flex: 1;
            resize: none;
            border: 0;
            outline: 0;
            padding: 10px;
            font: inherit;
            font-size: 15px;
            min-height: 42px;
            max-height: 130px;
            background: transparent;
        }

        .send {
            width: 42px;
            height: 42px;
            border: 0;
            border-radius: 13px;
            background: #111111;
            color: #ffffff;
            cursor: pointer;
            font-size: 18px;
            flex-shrink: 0;
        }

        .send:hover {
            opacity: .85;
        }

        .send:disabled {
            opacity: .35;
            cursor: not-allowed;
        }

        .footer-text {
            max-width: 850px;
            margin: 7px auto 0;
            text-align: center;
            font-size: 10px;
            color: #999999;
        }

        /* ==================================================
           MOBILE
           ================================================== */

        @media (max-width: 600px) {

            .header {
                height: 58px;
                padding: 0 14px;
            }

            .brand {
                font-size: 18px;
            }

            .logo {
                width: 31px;
                height: 31px;
            }

            .welcome h1 {
                font-size: 30px;
            }

            .welcome p {
                font-size: 14px;
            }

            .bubble {
                max-width: 88%;
                font-size: 14px;
            }

            .chat {
                padding-top: 12px;
            }

            .composer-area {
                padding-left: 9px;
                padding-right: 9px;
            }
        }

    </style>

</head>


<body>

<div class="app">

    <header class="header">

        <div class="brand">

            <div class="logo">
                A
            </div>

            <span>
                ADRYNX
            </span>

        </div>

        <div class="status">

            <span class="status-dot"></span>

            <span id="statusText">
                En ligne
            </span>

        </div>

    </header>


    <main
        class="chat"
        id="chat"
    >

        <div class="chat-inner">

            <section
                class="welcome"
                id="welcome"
            >

                <div class="welcome-logo">
                    A
                </div>

                <h1>
                    ADRYNX
                </h1>

                <p>
                    Ton environnement numérique
                    interactif et assistant cognitif.
                </p>

            </section>

        </div>

    </main>


    <div class="composer-area">

        <form
            class="composer"
            id="composer"
        >

            <textarea
                id="message"
                placeholder="Écris à ADRYNX..."
                rows="1"
                autocomplete="off"
            ></textarea>

            <button
                class="send"
                id="send"
                type="submit"
                aria-label="Envoyer"
            >
                ↑
            </button>

        </form>

        <div class="footer-text">
            ADRYNX peut faire des erreurs.
        </div>

    </div>

</div>


<script>

    const chat = document.getElementById("chat");
    const composer = document.getElementById("composer");
    const input = document.getElementById("message");
    const send = document.getElementById("send");
    const welcome = document.getElementById("welcome");
    const statusText = document.getElementById("statusText");

    let conversationId = null;

    function ajouterMessage(
        texte,
        type
    ) {

        if (welcome) {
            welcome.remove();
        }

        const wrapper =
            document.createElement("div");

        wrapper.className =
            "message " + type;

        const bubble =
            document.createElement("div");

        bubble.className = "bubble";

        bubble.textContent = texte;

        wrapper.appendChild(bubble);

        chat
            .querySelector(".chat-inner")
            .appendChild(wrapper);

        chat.scrollTop =
            chat.scrollHeight;

        return wrapper;
    }


    function ajouterChargement() {

        if (welcome) {
            welcome.remove();
        }

        const wrapper =
            document.createElement("div");

        wrapper.className =
            "message ai";

        wrapper.id =
            "loadingMessage";

        wrapper.innerHTML = `
            <div class="loading">
                <span></span>
                <span></span>
                <span></span>
            </div>
        `;

        chat
            .querySelector(".chat-inner")
            .appendChild(wrapper);

        chat.scrollTop =
            chat.scrollHeight;

        return wrapper;
    }


    function extraireReponse(data) {

        if (
            typeof data === "string"
        ) {
            return data;
        }

        if (!data) {
            return "ADRYNX n'a pas retourné de réponse.";
        }

        if (
            typeof data.reponse === "string"
        ) {
            return data.reponse;
        }

        if (
            typeof data.response === "string"
        ) {
            return data.response;
        }

        if (
            typeof data.answer === "string"
        ) {
            return data.answer;
        }

        if (
            typeof data.message === "string"
        ) {
            return data.message;
        }

        if (
            data.data
        ) {
            return extraireReponse(
                data.data
            );
        }

        return JSON.stringify(
            data,
            null,
            2
        );
    }


    async function envoyerMessage() {

        const message =
            input.value.trim();

        if (!message) {
            return;
        }

        ajouterMessage(
            message,
            "user"
        );

        input.value = "";

        input.style.height =
            "42px";

        send.disabled = true;

        const loading =
            ajouterChargement();

        try {

            const response =
                await fetch(
                    "/api/ask",
                    {
                        method: "POST",

                        headers: {
                            "Content-Type":
                                "application/json"
                        },

                        body: JSON.stringify({
                            message: message,
                            telephone: "anon",
                            conversation_id:
                                conversationId
                        })
                    }
                );

            let data = null;

            try {
                data =
                    await response.json();
            } catch {
                data = null;
            }

            loading.remove();

            if (!response.ok) {

                const erreur =
                    data?.detail
                    || "Une erreur est survenue.";

                ajouterMessage(
                    "Erreur : " + erreur,
                    "ai"
                );

                statusText.textContent =
                    "Erreur";

                return;
            }

            if (
                data &&
                data.conversation_id
            ) {

                conversationId =
                    data.conversation_id;
            }

            ajouterMessage(
                extraireReponse(data),
                "ai"
            );

            statusText.textContent =
                "En ligne";

        } catch (error) {

            loading.remove();

            ajouterMessage(
                "Impossible de contacter ADRYNX pour le moment.",
                "ai"
            );

            statusText.textContent =
                "Connexion indisponible";

        } finally {

            send.disabled = false;

            input.focus();
        }
    }


    composer.addEventListener(
        "submit",
        function(event) {

            event.preventDefault();

            envoyerMessage();
        }
    );


    input.addEventListener(
        "input",
        function() {

            this.style.height =
                "42px";

            this.style.height =
                Math.min(
                    this.scrollHeight,
                    130
                ) + "px";
        }
    );


    input.addEventListener(
        "keydown",
        function(event) {

            if (
                event.key === "Enter"
                &&
                !event.shiftKey
            ) {

                event.preventDefault();

                envoyerMessage();
            }
        }
    );


    async function verifierAPI() {

        try {

            const response =
                await fetch(
                    "/api/health"
                );

            if (response.ok) {

                statusText.textContent =
                    "En ligne";

            } else {

                statusText.textContent =
                    "API indisponible";
            }

        } catch {

            statusText.textContent =
                "Connexion indisponible";
        }
    }


    verifierAPI();

    input.focus();

</script>

</body>

</html>
